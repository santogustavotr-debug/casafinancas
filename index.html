<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CasaFinance</title>
<meta name="description" content="Controle financeiro da casa.">
<meta name="theme-color" content="#eaf0f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1626" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json?v=3">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CasaFinance">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --bg:#eaf0f6;--paper:#ffffff;--wash:#f3f6fa;--line:#d5dee9;--line2:#e6ecf3;
  --ink:#14213d;--ink2:#46546e;--ink3:#7d8aa3;
  --money:#1f8a5b;--money-soft:#dcf1e6;--boleto:#e9a800;--boleto-soft:#fdf1cc;--stamp:#c8323c;--stamp-soft:#f9e0e1;
  --gus:#2463eb;--lor:#8a4fd6;--casal:#0f8a8a;
  --fix:#14213d;--dia:#e9a800;--save:#2463eb;--left:#1f8a5b;
  --r:14px;--r2:9px;
  --display:"Bricolage Grotesque",system-ui,sans-serif;--body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
html[data-theme="dark"]{
  --bg:#0d1626;--paper:#152138;--wash:#1b2944;--line:#2a3a58;--line2:#223150;
  --ink:#e8eef8;--ink2:#b7c3d8;--ink3:#8292ad;
  --money:#3fc98a;--money-soft:#163a2e;--boleto:#f5c33b;--boleto-soft:#3a3218;--stamp:#ff6b73;--stamp-soft:#3d1d25;
  --gus:#6b9bff;--lor:#b98cff;--casal:#3cc7c7;
  --fix:#c9d6ee;--dia:#f5c33b;--save:#6b9bff;--left:#3fc98a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--gus);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Topo */
.top{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:14px 22px 0}
.brand-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.coin{width:28px;height:28px;border-radius:50%;background:var(--money);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.brand small{font-family:var(--body);font-weight:500;font-size:13px;color:var(--ink3);letter-spacing:0}
.spacer{flex:1}
.stepper{display:flex;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px}
.stepper button{border:0;background:transparent;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:18px;color:var(--ink2)}
.stepper button:hover{background:var(--wash)}
.stepper span{min-width:138px;text-align:center;font-weight:600;font-size:14px}
.stepper .hoje{width:auto;padding:0 12px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--gus)}
.theme{display:flex;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px}
.theme button{border:0;background:transparent;padding:6px 11px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--ink3);cursor:pointer}
.theme button.on{background:var(--ink);color:var(--bg)}
.groups{display:flex;gap:22px;margin-top:12px;overflow-x:auto;scrollbar-width:none}
.groups::-webkit-scrollbar{display:none}
.groups button{border:0;background:none;padding:8px 0 10px;font-weight:600;font-size:14.5px;color:var(--ink3);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.groups button.on{color:var(--ink);border-bottom-color:var(--money)}
.subnav{max-width:1240px;margin:0 auto;padding:14px 22px 0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.subnav::-webkit-scrollbar{display:none}
.subnav button{border:1px solid var(--line);background:var(--paper);padding:7px 14px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--ink2);cursor:pointer;white-space:nowrap}
.subnav button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}

main{max-width:1240px;margin:0 auto;padding:22px 22px 80px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,4.4vw,46px);letter-spacing:-.035em;line-height:1.05}
h1 .muted{color:var(--ink3);font-weight:500}
.lede{color:var(--ink2);margin-top:8px;max-width:68ch}
h2{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.02em;margin-bottom:12px}
h3{font-size:15px;font-weight:700;margin-bottom:8px}
.sec{margin-top:28px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--wash);border:1px solid var(--line);color:var(--ink2);white-space:nowrap}.pill.g{background:var(--money-soft);color:var(--money);border-color:transparent;font-weight:600}.pill.y{background:var(--boleto-soft);color:var(--ink);border-color:transparent;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.note{font-size:13px;color:var(--ink3)}
.pos{color:var(--money)}.neg{color:var(--stamp)}.warn{color:var(--boleto)}

/* Régua do mês */
.regua-wrap{margin-top:22px;background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:24px 24px 20px}
.regua-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.regua-head .big{font-family:var(--display);font-weight:800;font-size:clamp(34px,5vw,56px);letter-spacing:-.04em;line-height:1}
.regua-head .lbl{color:var(--ink3);font-size:14px}
.regua{display:flex;height:58px;border-radius:12px;overflow:hidden;margin:18px 0 14px;background:var(--wash)}
.regua div{position:relative;min-width:3px;transition:flex-grow .5s ease}
.regua div span{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-weight:700;font-size:13px;color:#fff;white-space:nowrap;text-shadow:0 1px 1px rgba(0,0,0,.15)}
.seg-fix{background:var(--fix)}.seg-dia{background:var(--dia)}.seg-save{background:var(--save)}.seg-left{background:var(--left)}
html[data-theme="dark"] .seg-fix span{color:#0d1626;text-shadow:none}
.seg-dia span{color:#2b2100!important;text-shadow:none!important}
.legend{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.legend>div{border-top:3px solid var(--line);padding-top:8px}
.legend .v{font-weight:700;font-size:19px;letter-spacing:-.01em}
.legend .k{font-size:13px;color:var(--ink3)}
.legend>.lg-fix{border-color:var(--fix)!important}.legend>.lg-dia{border-color:var(--dia)!important}.legend>.lg-save{border-color:var(--save)!important}.legend>.lg-left{border-color:var(--left)!important}

/* Frases */
.checks{list-style:none;display:grid;gap:8px}
.checks li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--wash);font-size:14.5px}
.checks .dot{width:22px;height:22px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-size:13px;font-weight:800;color:#fff}
.checks .ok .dot{background:var(--money)}.checks .no .dot{background:var(--stamp)}

/* Tabelas */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--paper)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--ink3);font-size:12.5px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--wash);white-space:nowrap;position:sticky;top:0}
td{padding:9px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;white-space:nowrap}
tfoot td{font-weight:700;background:var(--wash);border-top:1px solid var(--line)}
tr.cur td{background:color-mix(in srgb,var(--money) 8%,transparent)}
.sticky1 td:first-child,.sticky1 th:first-child{position:sticky;left:0;background:var(--paper);z-index:1}
.sticky1 th:first-child{background:var(--wash);z-index:2}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--wash);color:var(--ink2);white-space:nowrap}
.tag.g{background:var(--money-soft);color:var(--money)}.tag.r{background:var(--stamp-soft);color:var(--stamp)}.tag.y{background:var(--boleto-soft);color:color-mix(in srgb,var(--boleto) 70%,var(--ink))}
.who{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px}
.who i{width:9px;height:9px;border-radius:50%;display:inline-block}

/* Form */
input.f,select.f,textarea.f{background:var(--wash);border:1px solid var(--line);border-radius:var(--r2);padding:8px 10px;font-size:14px;width:100%}
input.f:focus,select.f:focus{outline:none;border-color:var(--gus);background:var(--paper)}
input.cell,select.cell{background:transparent;border:1px solid transparent;border-radius:7px;padding:5px 7px;font-size:13.5px;width:100%;min-width:70px}
input.cell:hover,select.cell:hover{border-color:var(--line)}
input.cell:focus,select.cell:focus{outline:none;border-color:var(--gus);background:var(--paper)}
input.cell.num{text-align:right}
select.cell{min-width:110px;padding-right:4px}
label.fl{display:grid;gap:5px;font-size:13px;font-weight:600;color:var(--ink2)}
.form{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;align-items:end}
.btn{border:0;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{opacity:.9}
.btn.green{background:var(--money);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--wash)}
.btn.sm{padding:6px 12px;font-size:13px}
.x{border:0;background:transparent;color:var(--ink3);cursor:pointer;font-size:18px;line-height:1;padding:2px 6px;border-radius:6px}
.x:hover{color:var(--stamp);background:var(--stamp-soft)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0}
.toolbar select.f,.toolbar input.f{width:auto}

.bar{height:8px;border-radius:999px;background:var(--wash);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--money)}
.stack{display:flex;height:16px;border-radius:999px;overflow:hidden;margin:4px 0 12px;background:var(--wash)}
.stack i{display:block;min-width:2px}
.srow{display:grid;grid-template-columns:12px 1fr 64px 104px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line2);font-size:14px}
.srow:last-of-type{border-bottom:0}
.srow.click{cursor:pointer;border-radius:8px;transition:background .15s}.srow.click:hover,.srow.on{background:var(--wash)}.srow .chev{color:var(--ink3);font-size:11px;margin-left:4px}
.sdet{margin:2px 0 8px 22px;padding:8px 10px;border-left:3px solid var(--line);background:var(--wash);border-radius:0 8px 8px 0;font-size:13px}
.sd-row{display:grid;grid-template-columns:42px 1fr auto auto;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line2);align-items:center}.sd-row:last-of-type{border-bottom:0}
.sd-d{color:var(--ink3)}.sd-n{min-width:0;overflow:hidden;text-overflow:ellipsis}.sd-p{color:var(--ink3);font-size:12px}.sd-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.insight{background:linear-gradient(135deg,var(--ink),#2b3f6b);color:#fff;border-radius:var(--r);padding:14px 16px;margin:4px 0 14px;cursor:pointer;min-height:118px}
html[data-theme="dark"] .insight{background:linear-gradient(135deg,#22345a,#2b2350)}
.ins-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.ins-tag{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#f5c33b;font-weight:700}
.ins-nav{display:flex;align-items:center;gap:6px;font-size:12px;color:#b7c3d8}.ins-nav button{background:rgba(255,255,255,.12);border:0;color:#fff;width:24px;height:24px;border-radius:7px;cursor:pointer}
.ins-txt{font-size:15px;line-height:1.45}.ins-txt b{color:#fff}.ins-txt .pos{color:#7be0ae}.ins-txt .neg{color:#ff9aa0}.ins-txt.in{animation:insIn .45s ease}
.ins-q{font-size:12px;color:#b7c3d8;margin-top:8px}
@keyframes insIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(max-width:600px){.sd-row{grid-template-columns:40px 1fr auto}.sd-p{display:none}}
.sw{width:12px;height:12px;border-radius:3px}.sp{text-align:right}.sv{text-align:right;color:var(--ink3);font-size:13px}
.hbar{display:grid;grid-template-columns:150px 1fr 96px;gap:10px;align-items:center;font-size:13.5px;padding:5px 0}
.hbar .bar{height:12px}
.drop{display:block;border:2px dashed var(--line);border-radius:var(--r);padding:26px;text-align:center;cursor:pointer;background:var(--paper)}
.drop:hover,.drop.on{border-color:var(--money);background:var(--money-soft)}
.drop b{display:block;font-size:16px;margin-bottom:4px}
.receipt{max-width:520px}
.receipt .ln{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed var(--line);font-size:15.5px}
.receipt .ln.tot{border-bottom:2px solid var(--ink);font-weight:800;font-size:18px}
.receipt .ln.final{border:0;font-family:var(--display);font-size:28px;font-weight:800;padding-top:14px}
.chartbox{position:relative;height:260px}
.hero-hora{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:0;margin-top:22px;background:var(--paper);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.hero-hora>div{padding:22px 24px;border-left:1px solid var(--line)}
.hero-hora>div:first-child{border-left:0;background:var(--ink);color:var(--bg)}
.hero-hora .k{font-size:13.5px;opacity:.75}
.hero-hora .v{font-family:var(--display);font-weight:800;font-size:clamp(26px,3.4vw,40px);letter-spacing:-.035em;line-height:1.1;margin-top:4px}
.hero-hora .s{font-size:13px;margin-top:4px;opacity:.75}
.ok-i{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;color:#fff;font-weight:800;font-size:12px}
@media(max-width:860px){.hero-hora{grid-template-columns:1fr 1fr}.hero-hora>div:nth-child(3){border-left:0}.hero-hora>div{border-top:1px solid var(--line)}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:99;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.lock{position:fixed;inset:0;background:var(--bg);display:none;place-items:center;z-index:200}
.lock.on{display:grid}
@media(max-width:860px){
  .grid2,.grid3{grid-template-columns:1fr}
  .legend{grid-template-columns:1fr 1fr}
  .form{grid-template-columns:1fr 1fr}
  .top-in{padding:12px 14px 0}.subnav{padding:12px 14px 0}main{padding:18px 14px 70px}
  .stepper span{min-width:110px}
  .hbar{grid-template-columns:110px 1fr 84px}
  .brand small{display:none}.theme button{padding:5px 9px}.stepper span{min-width:118px;font-size:13px}.brand-row{gap:10px}
  .regua{height:46px}.regua div span{display:none}
}

/* ---- Mago Merlin ---- */
.m-top{display:flex;align-items:center;gap:7px;background:var(--ink);color:var(--paper);border:0;border-radius:999px;padding:6px 14px 6px 10px;font-weight:600;font-size:13.5px;cursor:pointer;margin-right:8px}
.m-top:hover{filter:brightness(1.15)}
.m-fab{position:fixed;right:18px;bottom:18px;width:56px;height:56px;border-radius:50%;border:0;background:var(--ink);color:var(--paper);box-shadow:0 8px 24px rgba(20,33,61,.3);cursor:pointer;z-index:60;display:grid;place-items:center}
.m-fab svg{width:28px;height:28px}
body.m-open .m-fab{display:none}
.merlin{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:var(--paper);border-left:1px solid var(--line);box-shadow:-12px 0 40px rgba(0,0,0,.14);z-index:70;display:flex;flex-direction:column;transform:translateX(105%);transition:transform .25s ease}
.merlin.on{transform:none}
.m-head{display:flex;align-items:center;gap:10px;padding:14px 14px 12px;border-bottom:1px solid var(--line)}
.m-head b{font-family:var(--display);font-size:18px;display:block;line-height:1.1}.m-head small{color:var(--ink3);font-size:12.5px}
.m-av{width:38px;height:38px;border-radius:12px;background:var(--ink);color:var(--paper);display:grid;place-items:center;flex:none}
.m-ic{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--wash);cursor:pointer;font-weight:700;color:var(--ink2)}
.m-log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.m-msg{max-width:94%;padding:10px 13px;border-radius:14px;font-size:14.5px;line-height:1.45}
.m-msg.me{align-self:flex-end;background:var(--ink);color:var(--paper);border-bottom-right-radius:4px}
.m-msg.bot{align-self:flex-start;background:var(--paper);border:1px solid var(--line);border-bottom-left-radius:4px;width:94%}
.m-msg.bot b{font-weight:700}.m-msg .pos{color:var(--money)}.m-msg .neg{color:var(--stamp)}
.m-chart{position:relative;height:190px;margin-top:10px}.m-chart.dn{height:220px}
.m-list{margin-top:8px;border-top:1px dashed var(--line);font-size:13px}
.m-list div{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px dashed var(--line2)}.m-list span{color:var(--ink2);min-width:0;overflow:hidden;text-overflow:ellipsis}.m-list b{white-space:nowrap}
.m-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.m-chips button{border:1px solid var(--line);background:var(--wash);border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer;text-align:left;color:var(--ink)}
.m-chips button:hover{border-color:var(--gus);color:var(--gus)}
.m-sub{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);margin-top:10px}
.m-link{border:0;background:none;color:var(--gus);font-weight:600;margin-top:10px;cursor:pointer;padding:0}
.m-cat details{border-top:1px solid var(--line2);padding:7px 0}.m-cat summary{cursor:pointer;font-weight:600}.m-cat summary span{color:var(--ink3);font-weight:500;font-size:12px;margin-left:4px}
.m-iab{width:auto;padding:0 8px;font-size:12px}.m-iaf{display:grid;gap:8px;margin:10px 0 6px}
.m-form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);background:var(--paper)}
.m-form .f{flex:1}
.m-dots{display:inline-flex;gap:4px}.m-dots i{width:7px;height:7px;border-radius:50%;background:var(--ink3);animation:mdot 1s infinite}.m-dots i:nth-child(2){animation-delay:.15s}.m-dots i:nth-child(3){animation-delay:.3s}
@keyframes mdot{0%,100%{opacity:.25}50%{opacity:1}}
@media(max-width:700px){.m-top span{display:none}.m-top{padding:6px 8px}}
.nv-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink3);cursor:pointer;white-space:nowrap}
.nv-chip::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--ink3)}
.nv-chip.ok{color:var(--money)}.nv-chip.ok::before{background:var(--money)}.nv-chip.sync::before{background:var(--gus);animation:mdot 1s infinite}

function brNum(s){return parseFloat(String(s).replace(/\./g,'').replace(',','.'))}
function isoDate(d,m,y){return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`}
function normTxt(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim()}

// Agrupa os pedaços de texto do PDF em linhas (mesma altura = mesma linha)
function itemsToLines(items){
  const rows=[];
  items.forEach(it=>{
    if(!it.str||!it.str.trim())return;
    const y=it.transform[5],x=it.transform[4];
    let r=rows.find(r=>Math.abs(r.y-y)<2.5);
    if(!r){r={y,parts:[]};rows.push(r)}
    r.parts.push({x,s:it.str});
  });
  rows.sort((a,b)=>b.y-a.y);
  return rows.map(r=>r.parts.sort((a,b)=>a.x-b.x).map(p=>p.s).join(' ').replace(/\s+/g,' ').trim()).filter(Boolean);
}

function detectBank(text){
  const t=normTxt(text);
  if(/nu pagamentos|nubank|nu financeira/.test(t))return'Nubank';
  if(/itau|itaú/.test(t)&&/extrato conta|lancamentos|saldo do dia/.test(t))return'Itaú';
  if(/bradesco/.test(t)&&/extrato/.test(t))return'Bradesco';
  return'Outro';
}

// Descobre quem é o titular do extrato procurando os nomes das pessoas nas primeiras linhas
function detectHolder(lines,pessoas){
  const head=lines.slice(0,8);
  for(const l of head){
    const n=normTxt(l);
    for(const [p,pats] of Object.entries(pessoas)){
      if(pats.some(pt=>pt&&n.includes(normTxt(pt))))return{pessoa:p,nome:l.replace(/\s*\d{3}\.\d{3}\.\d{3}-\d{2}.*$/,'').replace(/\s*CPF.*$/i,'').trim()};
    }
  }
  return{pessoa:null,nome:(head[0]||'').slice(0,60)};
}

function parseItau(lines){
  const out=[];
  lines.forEach(l=>{
    const m=l.match(/^(\d{2})\/(\d{2})\/(\d{4})\s+(.*?)\s+(-?[\d.]+,\d{2})(?:\s+-?[\d.]+,\d{2})?$/);
    if(!m)return;
    const desc=m[4].trim();
    if(/saldo/i.test(desc))return;
    out.push({data:isoDate(m[1],m[2],m[3]),desc,valor:brNum(m[5])});
  });
  return out;
}

function parseNubank(lines,holderName){
  const out=[];let inMov=false,date=null,sign=1,last=null;
  const skip=/^(tem alguma d|metropolitanas|caso a solu|dispon[ií]veis em|extrato gerado|cpf|o saldo l[ií]quido|n[aã]o nos respons|asseguramos|nu financeira|investimento pagamento|cnpj|\d{1,2} de [a-z]+ de \d{4} a|\d{6,}-\d$|valores em r\$|saldo |rendimento|total de entradas \+[\d.]|total de sa[ií]das -[\d.])/i;
  const hn=normTxt(holderName);
  lines.forEach(l=>{
    if(/^movimenta/i.test(l)){inMov=true;return}
    if(!inMov)return;
    const n=normTxt(l);
    if(hn&&n===hn){last=null;return}
    const dh=l.match(/^(\d{2}) (JAN|FEV|MAR|ABR|MAI|JUN|JUL|AGO|SET|OUT|NOV|DEZ) (\d{4})(?:\s+Total de (entradas|sa[ií]das))?/i);
    if(dh){date=isoDate(dh[1],MES_ABR[dh[2].toUpperCase()],dh[3]);if(dh[4])sign=/entradas/i.test(dh[4])?1:-1;last=null;return}
    const tot=l.match(/^Total de (entradas|sa[ií]das)\s*[+-]\s*[\d.]+,\d{2}$/i);
    if(tot){sign=/entradas/i.test(tot[1])?1:-1;last=null;return}
    if(skip.test(l)){last=null;return}
    const tx=l.match(/^(.*\S)\s+([\d.]+,\d{2})$/);
    if(tx&&date){last={data:date,desc:tx[1].trim(),valor:sign*brNum(tx[2])};out.push(last);return}
    if(last&&last.desc.length<160)last.desc+=' '+l;
  });
  return out;
}

function parseGenericPdf(lines){
  const out=[];
  lines.forEach(l=>{
    const m=l.match(/^(\d{2})\/(\d{2})(?:\/(\d{2,4}))?\s+(.*?)\s+(-?R?\$?\s?-?[\d.]+,\d{2})(?:\s+-?[\d.]+,\d{2})?$/);
    if(!m)return;
    if(/saldo/i.test(m[4]))return;
    let y=m[3]||String(new Date().getFullYear());if(y.length===2)y='20'+y;
    const v=brNum(m[5].replace(/R\$|\s/g,''));
    out.push({data:isoDate(m[1],m[2],y),desc:m[4].trim(),valor:/^-|-R|R\$\s?-/.test(m[5].trim())?-Math.abs(v):v});
  });
  return out;
}

function parseOFX(text){
  const out=[];
  const blocks=text.split(/<STMTTRN>/i).slice(1);
  blocks.forEach(b=>{
    const g=t=>{const m=b.match(new RegExp('<'+t+'>([^<\\r\\n]*)','i'));return m?m[1].trim():''};
    const d=g('DTPOSTED');if(!d)return;
    const v=parseFloat(g('TRNAMT').replace(',','.'));
    out.push({data:`${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6,8)}`,desc:g('MEMO')||g('NAME')||'Lançamento',valor:v});
  });
  return out;
}

function parseCSV(text){
  const lines=text.split(/\r?\n/).filter(l=>l.trim());if(!lines.length)return[];
  const sep=lines[0].split(';').length>lines[0].split(',').length?';':',';
  const split=l=>{const r=[];let cur='',q=false;for(const ch of l){if(ch==='"'){q=!q;continue}if(ch===sep&&!q){r.push(cur);cur=''}else cur+=ch}r.push(cur);return r.map(s=>s.trim())};
  const head=split(lines[0]).map(normTxt);
  const iD=head.findIndex(h=>/^data/.test(h)),iV=head.findIndex(h=>/valor|amount/.test(h)),iDesc=head.findIndex(h=>/descri|hist|title|estabelec/.test(h));
  if(iD<0||iV<0)return[];
  return lines.slice(1).map(l=>{
    const c=split(l);const ds=c[iD]||'';let data;
    if(/^\d{4}-\d{2}-\d{2}/.test(ds))data=ds.slice(0,10);
    else{const m=ds.match(/(\d{2})\/(\d{2})\/(\d{4})/);if(!m)return null;data=isoDate(m[1],m[2],m[3])}
    const raw=c[iV]||'0';const v=/,\d{2}$/.test(raw)?brNum(raw):parseFloat(raw);
    return{data,desc:(c[iDesc]||'Lançamento').trim(),valor:v};
  }).filter(Boolean);
}

// ---------- Classificação automática ----------
const CAT_RULES=[
  ['Transporte/Combustível',/\b(uber|99|jae|metro|metr[oô]|onibus|riocard|posto|combust|shell|ipiranga|estacionamento|pedagio)\b/],
  ['Mercado',/(mercado|supermerc|hortifruti|assai|atacad|carrefour|guanabara|prezunic)/],
  ['Restaurante/Delivery',/(restaur|\bbar\b|lanch|ifood|padaria|rocket|burger|pizza|acai|food|cafe|rappi)/],
  ['Farmácia',/(farm|drog|raia|pacheco)/],
  ['Saúde',/(clinic|hospital|laborat|odonto|medic)/],
  ['Lazer',/(shopping|cinema|hotzone|ingresso|steam|playstation|xbox|show)/],
  ['Assinaturas',/(netflix|spotify|google|amazon|disney|youtube|apple|hbo|globoplay|prime)/],
  ['Internet/Celular',/\b(claro|tim|vivo|oi|rochas)\b/],
  ['Luz',/(light|enel)/],['Água',/(cedae|aguas)/],['Gás',/(naturgy|ceg\b|gas)/],
  ['Aluguel/Moradia',/(aluguel|imobili)/],['Condomínio',/condom/],
  ['Escola/Cursos',/(curso|escola|faculdade|udemy|alura)/],
  ['Roupas',/(renner|riachuelo|c&a|cea|zara|shein|hering)/],
];
const FATURA_RE=/(cartao de credito|cartao credito|cart credito|pagto cartao|pagamento cartao|pagamento de fatura|pagto fatura|fatura|bradesco est|qrs bradesco|bradesco es\d)/;
function guessCat(d){for(const[c,re]of CAT_RULES)if(re.test(d))return c;return'Outros'}

function classify(tx,holder,cfg,recorrentes){
  const d=normTxt(tx.desc);const ent=tx.valor>0;
  const own=(cfg.pessoas[holder]||[]).some(p=>p&&d.includes(normTxt(p)));
  const partner=Object.entries(cfg.pessoas).filter(([p])=>p!==holder).some(([,pats])=>pats.some(p=>p&&d.includes(normTxt(p))));
  if(/cofrinho/.test(d))return ent?{cls:'interno'}:{cls:'guardado',cat:'Reserva'};
  if(/\brdb\b|aplicacao|resgate|tbi \d/.test(d))return{cls:'interno'};
  if(/estorno/.test(d))return{cls:'estorno',cat:guessCat(d)};
  if(!ent&&FATURA_RE.test(d))return{cls:'fatura',cat:'Fatura do cartão'};
  if(own){if(ent&&tx.valor>=1000)return{cls:'salario',cat:'Salário'};return{cls:'interno'}}
  if(partner)return{cls:'casal',cat:'Outros'};
  if(!ent){
    const r=(recorrentes||[]).find(r=>(r.match||[]).some(k=>k&&d.includes(normTxt(k))));
    if(r)return{cls:'fixa',cat:r.cat,recKey:r.key};
    return{cls:'gasto',cat:guessCat(d)};
  }
  return{cls:'entrada',cat:'Outros'};
}

// Saldo final do extrato (para o balanço patrimonial)
function extractSaldo(lines,banco){
  const MESX={janeiro:1,fevereiro:2,marco:3,abril:4,maio:5,junho:6,julho:7,agosto:8,setembro:9,outubro:10,novembro:11,dezembro:12};
  if(banco==='Nubank'){
    const sf=lines.find(l=>/^Saldo final do per[ií]odo\s+-?[\d.]+,\d{2}/i.test(l));
    const per=lines.map(l=>normTxt(l).match(/\d{1,2} de [a-z]+ de \d{4} a (\d{1,2}) de ([a-z]+) de (\d{4})/)).find(Boolean);
    if(sf&&per&&MESX[per[2]]){const v=brNum(sf.match(/(-?[\d.]+,\d{2})\s*$/)[1]);return{data:isoDate(per[1],MESX[per[2]],per[3]),valor:v}}
  }
  const sd=lines.map(l=>l.match(/^(\d{2})\/(\d{2})\/(\d{4})\s+SALDO DO DIA\s+(-?[\d.]+,\d{2})/i)).filter(Boolean)
    .map(m=>({data:isoDate(m[1],m[2],m[3]),valor:brNum(m[4])})).sort((a,b)=>b.data.localeCompare(a.data));
  return sd[0]||null;
}


// ================= HOLERITE E CARTÃO DE PONTO =================
const hm2min=t=>{const m=String(t).match(/(\d{1,3}):(\d{2})/);return m?(+m[1])*60+(+m[2]):0};
const min2hm=x=>{const s=x<0?'−':'';x=Math.abs(Math.round(x));return`${s}${Math.floor(x/60)}h${String(x%60).padStart(2,'0')}`};
const brn=s=>parseFloat(String(s).replace(/\./g,'').replace(',','.'));

function parseHolerite(lines){
  const txt=lines.join('\n');
  const comp=txt.match(/Demonstrativo de Pagamento\s*-\s*(\d{1,2})\s*\/\s*(\d{4})/i);
  if(!comp)return null;
  const h={tipo:'holerite',comp:`${comp[2]}-${String(comp[1]).padStart(2,'0')}`,proventos:[],descontos:[]};
  const nm=txt.match(/\n\s*\d{5,}\s+([A-ZÁÉÍÓÚÂÊÔÃÕÇ ]{6,}?)\s{1,}(ANALISTA|ASSISTENTE|AUXILIAR|COORDENADOR|GERENTE|TECNICO|TÉCNICO|ENGENHEIRO|ESTAGI)/);
  if(nm)h.nome=nm[1].trim();
  const fn=txt.match(/\d{5,}\s+[A-ZÁÉÍÓÚÂÊÔÃÕÇ ]+?\s+((?:ANALISTA|ASSISTENTE|AUXILIAR|COORDENADOR|GERENTE|TECNICO|TÉCNICO)[^\n]*)/);if(fn)h.funcao=fn[1].trim();
  const adm=txt.match(/(\d{2})\/(\d{2})\/(\d{4})\s+([\d.]+,\d{2})/);
  if(adm){h.admissao=`${adm[3]}-${adm[2]}-${adm[1]}`;h.base=brn(adm[4])}
  let sec=null;
  lines.forEach(l=>{
    if(/^Proventos/i.test(l)){sec='proventos';return}
    if(/^Descontos/i.test(l)){sec='descontos';return}
    if(/^Base para/i.test(l)){sec=null}
    const m=l.match(/^([A-Z]?\d{3,4})\s+(.+?)\s+(-?[\d.]+,\d{2})\s+([\d.]+,\d{2})$/);
    if(m&&sec)h[sec].push({cod:m[1],desc:m[2].trim(),qtd:brn(m[3]),valor:brn(m[4])});
  });
  const g=re=>{const m=txt.match(re);return m?brn(m[1]):null};
  h.baseFGTS=g(/Base para FGTS:\s*([\d.]+,\d{2})/i);h.fgts=g(/FGTS:\s*([\d.]+,\d{2})\s*L/i)??g(/\bFGTS:\s*([\d.]+,\d{2})/);
  h.baseIRRF=g(/Base para IRRF:\s*([\d.]+,\d{2})/i);h.baseINSS=g(/Base para INSS:\s*([\d.]+,\d{2})/i);
  const liq=txt.match(/Base para INSS:\s*[\d.]+,\d{2}\s+([\d.]+,\d{2})/i)||txt.match(/L[ií]quido a Receber[^\d]*([\d.]+,\d{2})/i);
  h.liquido=liq?brn(liq[1]):null;
  h.totProv=Math.round(h.proventos.reduce((s,x)=>s+x.valor,0)*100)/100;
  h.totDesc=Math.round(h.descontos.reduce((s,x)=>s+x.valor,0)*100)/100;
  return h;
}

const DIAS_SEM=['DOM','SEG','TER','QUA','QUI','SEX','SAB'];
function parsePonto(text){
  if(!/Cart[aã]o de Ponto/i.test(text))return null;
  const p={tipo:'ponto',dias:[],folha:[]};
  const ref=text.match(/Refer[eê]ncia:\s*([A-Za-zçÇ]+)\s*\/\s*(\d{4})/i);
  const MES={janeiro:1,fevereiro:2,marco:3,'março':3,abril:4,maio:5,junho:6,julho:7,agosto:8,setembro:9,outubro:10,novembro:11,dezembro:12};
  if(ref){const mm=MES[ref[1].toLowerCase()];if(mm)p.comp=`${ref[2]}-${String(mm).padStart(2,'0')}`}
  const per=text.match(/(\d{2})\/(\d{2})\/(\d{4})\s*[àa]\s*(\d{2})\/(\d{2})\/(\d{4})/);
  if(per){p.ini=`${per[3]}-${per[2]}-${per[1]}`;p.fim=`${per[6]}-${per[5]}-${per[4]}`}
  const hor=text.match(/Hor[aá]rio:\s*\d*\s*((\d{2}:\d{2})-(\d{2}:\d{2})-(\d{2}:\d{2})-(\d{2}:\d{2}))/i);
  if(hor){const a=[2,3,4,5].map(i=>hm2min(hor[i]));p.horario=hor[1];p.jornada=(a[1]-a[0])+(a[3]-a[2]);p.intervalo=a[2]-a[1]}
  else{p.jornada=510;p.intervalo=75}
  const L=text.split(/\r?\n/);
  L.forEach((l,i)=>{
    const m=l.match(/^\s*(\d{2})\/(\d{2})\/(\d{4})\s+(SEG|TER|QUA|QUI|SEX|SAB|S[AÁ]B|DOM)\b(.*)$/i);
    if(!m)return;
    let rest=m[5];
    const data=`${m[3]}-${m[2]}-${m[1]}`;
    const corte=rest.search(/[|\[]|ABONO|ATESTADO|FERIAS|FÉRIAS|FALTA/i);
    const antes=corte>=0?rest.slice(0,corte):rest;
    const marc=(antes.match(/\b\d{2}:\d{2}\b/g)||[]);if(marc.length%2)marc.pop();
    const ocor=(rest.match(/(ABONO(?: CHEFIA)?(?: PARCIAL)?|ATESTADO M[EÉ]DICO(?: - DIA)?|F[EÉ]RIAS|FALTA(?: INJUSTIFICADA)?)/i)||[''])[0].replace(/\s+/g,' ').trim();
    const evento=!marc.length&&!/ABONO|ATESTADO/i.test(rest)?(antes.match(/[A-ZÁÉÍÓÚÂÊÔÃÕÇ]{3,}(?:\s+[A-ZÁÉÍÓÚÂÊÔÃÕÇ]{2,})+/)||[''])[0].trim():'';
    const fimLinha=(rest.match(/(\d{2}:\d{2})\s*$/)||[])[1];
    p.dias.push({data,dow:m[4].toUpperCase().replace('SÁB','SAB'),marc,ocor:ocor+(/^ABONO$/i.test(ocor)&&/CHEFIA/i.test(L[i+1]||'')?' CHEFIA PARCIAL':''),evento:/^\d/.test(evento)?'':evento,abonoLinha:/ABONO|ATESTADO/i.test(rest)&&fimLinha?fimLinha:null});
  });
  p.dias.forEach(d=>{
    const t=d.marc.map(hm2min);let work=0;for(let i=0;i+1<t.length;i+=2)work+=t[i+1]-t[i];
    let calc=work;if(t.length>=4){const lunch=t[2]-t[1];calc=work-Math.max(0,p.intervalo-lunch)}
    d.trab=t.length>=2?calc:0;d.saldo=t.length>=2?d.trab-p.jornada:0;
    d.feriado=!!d.evento&&!/^(SAB|DOM)$/.test(d.dow);
    d.atestado=/ATESTADO/i.test(d.ocor);
  });
  const ti=text.search(/Totais gerados/i),tt=ti>=0?text.slice(ti):'';
  const tot=re=>{const m=tt.match(re);return m?hm2min(m[1]):null};
  p.totais={atraso:tot(/Atraso\s+(\d{2,3}:\d{2})/i),abono:tot(/Abono\s+(\d{2,3}:\d{2})/i),saida:tot(/Sa[ií]da Antecipada\s+(\d{2,3}:\d{2})/i),trab:tot(/Horas Trabalhadas\s+(\d{2,3}:\d{2})/i),extras:tot(/Extras a pagar\s+(\d{2,3}:\d{2})/i),faltas:tot(/Faltas?\s+(\d{2,3}:\d{2})/i)};
  const fi=text.search(/Movimento da Folha/i);
  if(fi>=0)text.slice(fi).split(/\r?\n/).forEach(l=>{const m=l.match(/^\s*([A-Z]?\d{3,4})\s+(.+?)\s+(\d{2,3}:\d{2})\s*$/);if(m)p.folha.push({cod:m[1],desc:m[2].trim(),min:hm2min(m[3])})});
  p.calc={abonoChefia:p.dias.filter(d=>!d.atestado&&d.abonoLinha).reduce((s,d)=>s+hm2min(d.abonoLinha),0),atestadoMin:p.dias.filter(d=>d.atestado).reduce((s,d)=>s+(d.abonoLinha?hm2min(d.abonoLinha):p.jornada),0),trab:p.dias.reduce((s,d)=>s+d.trab,0),falta:p.dias.reduce((s,d)=>s+(d.saldo<0?-d.saldo:0),0),sobra:p.dias.reduce((s,d)=>s+(d.saldo>0?d.saldo:0),0),diasTrab:p.dias.filter(d=>d.trab>0).length};
  return p;
}

// Conferência: compara holerite com as regras e com o ponto
function conferir(h,p,cfg){
  const div=cfg.divisor||220,hora=h.base/div,dia=h.base/30;
  const find=re=>h.proventos.find(x=>re.test(x.desc));
  const fd=re=>h.descontos.find(x=>re.test(x.desc));
  const out=[];const chk=(item,valor,esperado,obs,tol=0.05)=>out.push({item,valor,esperado,ok:esperado==null?null:Math.abs(valor-esperado)<=Math.max(tol,Math.abs(esperado)*0.003),obs});
  const he50=find(/EXTRA\s*50/i),he100=find(/EXTRA\s*100/i),dsr=find(/DSR/i),sal=find(/SALARIO MENSAL|SALÁRIO MENSAL/i),at=find(/ATESTADO/i);
  const fol=re=>p&&p.folha.find(x=>re.test(x.desc));
  const q50=fol(/50/)?fol(/50/).min/60:he50?he50.qtd:0,q100=fol(/100/)?fol(/100/).min/60:he100?he100.qtd:0;
  if(sal)chk(`Salário (${sal.qtd} dias)`,sal.valor,dia*sal.qtd,`${brlH(h.base)} ÷ 30 × ${sal.qtd}`);
  if(at)chk(`Atestado (${at.qtd} dia)`,at.valor,dia*at.qtd,'Dia de atestado pago como dia normal');
  if(he50)chk(`Hora extra 50% (${min2hm(q50*60)})`,he50.valor,q50*hora*1.5,`${min2hm(q50*60)} × ${brlH(hora*1.5)}`);
  if(he100)chk(`Hora extra 100% (${min2hm(q100*60)})`,he100.valor,q100*hora*2,`${min2hm(q100*60)} × ${brlH(hora*2)}`);
  let uteis=null,desc=null;
  if(dsr&&h.comp){
    const[y,m]=h.comp.split('-').map(Number);const nd=new Date(y,m,0).getDate();
    const fer=new Set((p?p.dias:[]).filter(d=>d.feriado&&d.data.slice(0,7)===h.comp).map(d=>d.data));
    let dom=0;for(let d=1;d<=nd;d++){const w=new Date(y,m-1,d).getDay();const k=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;if(w===0||fer.has(k))dom++}
    desc=dom;uteis=nd-dom;
    const heTot=(he50?he50.valor:0)+(he100?he100.valor:0);
    chk('DSR sobre horas extras',dsr.valor,heTot/uteis*desc,`${brlH(heTot)} ÷ ${uteis} dias úteis × ${desc} domingos/feriados`);
  }
  const base=h.baseINSS||h.totProv;
  const inssD=fd(/INSS/i);if(inssD)chk('INSS',inssD.valor,inssCalc(base,cfg),`Tabela progressiva sobre ${brlH(base)}`,0.03);
  const ir=fd(/IRRF|IMPOSTO/i);out.push({item:'Imposto de renda',valor:ir?ir.valor:0,esperado:base<=5000?0:null,ok:base<=5000?!(ir&&ir.valor>0):null,obs:base<=5000?'Isento: base até R$ 5.000 (regra de 2026)':'Base acima de R$ 5.000 — confira com o RH'});

function lorBase(){const c=C();return r2((+c.brutoLor||+c.salLor)+(+c.notLor||0))}
function lorBruto(k){const c=C();return r2(lorBase()*Math.pow(1+c.reajLor,nReaj(k,c.mesReajLor)))}
function decimo(y){
  const c=C(),adm=new Date(c.admGus+'T00:00');let meses=12;
  if(adm.getFullYear()>y)meses=0;else if(adm.getFullYear()===y){const dim=new Date(y,adm.getMonth()+1,0).getDate();meses=13-(adm.getMonth()+1)-((dim-adm.getDate()+1)<15?1:0)}
  const n=Math.max(0,y-c.baseAno);
  const bG=r2(c.brutoGus*Math.pow(1+c.reajGus,n)*meses/12),g1=r2(bG/2),iG=inss(bG),g2=r2(bG-g1-iG-(bG-iG)*c.irDecimo);
  const bL=r2(lorBase()*Math.pow(1+c.reajLor,n)),l1=r2(bL/2),iL=inss(bL),l2=r2(bL-l1-iL-(bL-iL)*c.irDecimo);
  return{y,meses,bG,g1,iG,g2,bL,l1,iL,l2,total:r2(g1+g2+l1+l2)};
}
function receitas(k){
  const c=C(),[y,m]=k.split('-').map(Number);
  const hol=(db.holerites||{})['P1|'+kAdd(k,-1)];
  const gus=hol&&hol.h&&hol.h.liquido?hol.h.liquido:liqReaj(c.salGus,c.brutoGus,c.reajGus,nReaj(kAdd(k,-1),c.mesReajGus));
  const hl=(db.holerites||{})['P2|'+k];let lor,lorAd,lorRest;
  if(hl&&hl.h&&hl.h.liquido){const ad=hl.h.descontos.filter(i=>/ADIANT/i.test(i.desc)).reduce((s,i)=>s+i.valor,0);lorRest=r2(hl.h.liquido);lorAd=r2(ad);lor=r2(lorAd+lorRest)}
  else{lor=+c.brutoLor?liqReaj(c.salLor,lorBase(),c.reajLor,nReaj(k,c.mesReajLor)):r2(c.salLor*Math.pow(1+c.reajLor,nReaj(k,c.mesReajLor)));lorAd=r2(lor*c.pctAdiant);lorRest=r2(lor-lorAd)}
  const d=decimo(y),g13=m===11?d.g1:m===12?d.g2:0,l13=m===11?d.l1:m===12?d.l2:0;
  const fb=Math.pow(1+c.reajBenef,Math.max(0,y-c.baseAno));
  const va=r2(c.vaGus*fb),lb=r2(c.benefLor*fb),lref=r2(lb*c.pctRefLor),lali=r2(lb-lref);
  return{gus,fG:!!(hol&&hol.h&&hol.h.liquido),fL:!!(hl&&hl.h&&hl.h.liquido),compG:kAdd(k,-1),lorAd,lorRest,g13,l13,sal:r2(gus+lor),dec:r2(g13+l13),cash:r2(gus+lor+g13+l13),va,lref,lali,benef:r2(va+lb)};
}

  if(cat==='Transporte/Combustível'&&/\b(uber|99|99app|99pop)\b/.test(d))return'Uber / 99';

// Tudo que saiu no mês (contas fixas + dia a dia, inclusive VR/VA), agrupado por setor
function porSetor(k){
  const g={};const add=(n,v)=>{if(v)g[n]=r2((g[n]||0)+v)};
  fixas(k).forEach(f=>add(setorDe(f.cat,f.desc),f.usado));
  txMes(k).filter(t=>(t.cls==='gasto'&&t.forma!=='Cartão de crédito')||t.cls==='estorno').forEach(t=>add(setorDe(t.cat,t.desc),-t.valor));
  txMes(k).filter(t=>t.cls==='fatura').forEach(t=>add('Cartões e parcelas',-t.valor));
  const tot=Object.values(g).reduce((a,b)=>a+b,0);
  return{tot:r2(tot),lista:SETORES.map(([n])=>[n,g[n]||0,tot?(g[n]||0)/tot:0]).filter(x=>x[1]>0.004).sort((a,b)=>b[1]-a[1])};

function addTx(f){const d=Object.fromEntries(new FormData(f));db.tx.push({id:db.nextId++,data:d.data,desc:d.desc,valor:-Math.abs(+d.valor),cat:d.cat,forma:d.forma,pessoa:d.pessoa,cls:'gasto',banco:'Manual',origem:'manual'});save();toast('Gasto adicionado');cur=d.data.slice(0,7);render()}
function updTx(id,f,v){const t=db.tx.find(x=>x.id===id);if(!t)return;t[f]=v;if(f==='cls'){if(v==='guardado')t.cat='Reserva';if(v==='fixa'&&!t.recKey){const r=db.rec.find(r=>(r.match||[]).some(m=>m&&normTxt(t.desc).includes(normTxt(m))));if(r)t.recKey=r.key}}save();render()}
function delTx(id){if(!confirm('Excluir este lançamento?'))return;db.tx=db.tx.filter(x=>x.id!==id);save();render()}

async function pdfLines(buf){
  if(!window.pdfjsLib)throw new Error('o leitor de PDF não carregou — confira a internet e tente de novo');
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const doc=await pdfjsLib.getDocument({data:buf}).promise;let L=[];
  for(let i=1;i<=doc.numPages;i++){const p=await doc.getPage(i);L=L.concat(itemsToLines((await p.getTextContent()).items))}return L;
}
async function lerArquivos(files){
  files=Array.from(files||[]);const st=document.getElementById('ex-status');
  for(const f of files){
    if(st)st.textContent=`Lendo ${f.name}…`;
    try{
      let banco='Outro',h={pessoa:null,nome:''},txs=[],saldoLido=null;
      if(/\.pdf$/i.test(f.name)){const L=await pdfLines(new Uint8Array(await f.arrayBuffer()));banco=detectBank(L.join('\n'));h=detectHolder(L,C().pessoas);txs=banco==='Itaú'?parseItau(L):banco==='Nubank'?parseNubank(L,h.nome):parseGenericPdf(L);saldoLido=extractSaldo(L,banco)}
      else{const t=await f.text();if(/<OFX>|<STMTTRN>/i.test(t)){txs=parseOFX(t);banco=detectBank(t)}else{txs=parseCSV(t);banco=/nu_|nubank/i.test(f.name)?'Nubank':'CSV'}h=detectHolder(t.split(/\r?\n/).slice(0,20),C().pessoas)}
      const pessoa=h.pessoa||'P1';

async function carregarOCR(st){
  if(window.Tesseract)return;
  st(`Baixando o leitor de imagens…`);
  await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';s.onload=res;s.onerror=()=>rej(new Error('não consegui baixar o leitor de imagens — confira a internet'));document.head.appendChild(s)});
}
async function ocrImagens(imgs,st){
  await carregarOCR(st);
  const w=await Tesseract.createWorker('por',1,{workerPath:'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js',corePath:'https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1',langPath:'https://cdn.jsdelivr.net/npm/@tesseract.js-data/por@1.0.0/4.0.0_best_int',logger:m=>{if(m.status==='recognizing text')st(`Lendo o cartão de ponto… ${Math.round(m.progress*100)}%`)}});
  await w.setParameters({tessedit_pageseg_mode:'6',preserve_interword_spaces:'0'});
  let out='';for(const im of imgs){const{data}=await w.recognize(im);out+=data.text+'\n'}
  await w.terminate();return out;
}
async function pdfCanvases(buf){
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const doc=await pdfjsLib.getDocument({data:buf}).promise,out=[];
  for(let i=1;i<=doc.numPages;i++){const pg=await doc.getPage(i);const vp=pg.getViewport({scale:3});const cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;const ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);await pg.render({canvasContext:ctx,viewport:vp}).promise;out.push(cv)}
  return out;
}
async function lerHolerite(files){
  files=Array.from(files||[]);const el=document.getElementById('hol-status'),st=t=>{if(el)el.textContent=t};
  db.holerites=db.holerites||{};let ult=null;
  for(const f of files){
    try{
      st(`Lendo ${f.name}…`);let lines=[],text='';
      if(/\.pdf$/i.test(f.name)){
        if(!window.pdfjsLib)throw new Error('o leitor de PDF não carregou — confira a internet');
        const buf=new Uint8Array(await f.arrayBuffer());lines=await pdfLines(buf.slice());text=lines.join('\n');
        if(!/Demonstrativo de Pagamento|Cart[aã]o de Ponto/i.test(text)){text=await ocrImagens(await pdfCanvases(buf),st);lines=text.split(/\r?\n/)}
      }else{text=await ocrImagens([f],st);lines=text.split(/\r?\n/)}
      const h=/Demonstrativo de Pagamento/i.test(text)?parseHolerite(lines):null;
      const p=!h&&/Cart[aã]o de Ponto/i.test(text)?parsePonto(text):null;
      const quem=quemE(text.split(/\r?\n/).slice(0,40).join(' '))||holPessoa;
      const key=c=>quem+'|'+c;
      if(h&&h.comp){db.holerites[key(h.comp)]={...(db.holerites[key(h.comp)]||{}),h};ult=[quem,h.comp];if(quem==='P2'){const c=C(),noct=h.proventos.filter(i=>/NOTURN/i.test(i.desc)).reduce((x,i)=>x+i.valor,0);if(h.base)c.brutoLor=h.base;c.notLor=r2(noct);if(h.liquido)c.salLor=r2(h.liquido+h.descontos.filter(i=>/ADIANT/i.test(i.desc)).reduce((x,i)=>x+i.valor,0))}toast(`Contracheque de ${quem} (${mesCurto(h.comp)}) lido`)}
      else if(p&&p.comp){db.holerites[key(p.comp)]={...(db.holerites[key(p.comp)]||{}),p};ult=[quem,p.comp];toast(`Cartão de ponto de ${quem} (${mesCurto(p.comp)}) lido: ${p.dias.length} dias`)}
      else toast(`Não reconheci ${f.name} como contracheque ou cartão de ponto`);
    }catch(e){toast(`Não consegui ler ${f.name}: ${e.message}`)}
  }
  st('');if(ult){holPessoa=ult[0];holSel=ult[1];if(page==='receitas')cur=ult[0]==='P1'?kAdd(ult[1],1):ult[1]}save();render();
}

/* ---------- Saldos e patrimônio ---------- */
function saldoConta(k,key){ // último saldo conhecido até o fim do mês k
  for(let n=kNum(k);n>=kNum(k)-24;n--){const s=(db.saldos[numK(n)]||{})[key];if(s&&s.v!==null&&s.v!==undefined&&s.v!=='')return{v:+s.v,de:numK(n),auto:s.auto}}
  return null;
}
function parcelasRestantes(k,dono){
  return db.rec.filter(r=>r.parcelas&&r.inicio&&r.ativo!==false&&(!dono||r.pessoa===dono)).map(r=>{
    const fim=kNum(r.inicio)+r.parcelas-1,n=kNum(k);const rest=n<kNum(r.inicio)?r.parcelas:Math.max(0,fim-n);
    return{nome:r.desc,dono:r.pessoa,valor:r2(rest*r.valor),rest}}).filter(x=>x.valor>0);
}
function balanco(k,dono){
  const ativos=db.contas.filter(c=>!dono||c.dono===dono).map(c=>{const s=saldoConta(k,c.key);return{...c,v:s?s.v:0,info:s,tem:!!s}});
  const parc=parcelasRestantes(k,dono);
  const div=db.dividas.filter(x=>!dono||x.dono===dono);
  const tA=r2(ativos.reduce((s,a)=>s+a.v,0)),tP=r2(parc.reduce((s,p)=>s+p.valor,0)+div.reduce((s,x)=>s+(+x.valor||0),0));
  return{ativos,parc,div,tA,tP,pl:r2(tA-tP),temDados:ativos.some(a=>a.tem)};
}

/* ---------- Provisões ---------- */
function provisaoMes(k){
  if(kNum(k)<kNum(C().provInicio||'2026-11'))return{tot:0,itens:[]};
  const itens=db.provisoes.map(p=>({...p,mensal:r2((+p.valor||0)/12)}));
  return{tot:r2(itens.reduce((s,p)=>s+p.mensal,0)),itens};
}

/* ---------- Contas fixas (com cartões substituídos pela fatura real) ---------- */
function fixas(k){
  const t=txMes(k),pagas=t.filter(x=>x.cls==='fixa');
  const faturaDe=p=>t.some(x=>x.cls==='fatura'&&x.pessoa===p);
  return recAtivas(k).map(r=>{
    const pago=pagas.filter(x=>x.recKey===r.key).reduce((s,x)=>s-x.valor,0);
    if(r.cartao&&faturaDe(r.pessoa))return{...r,pago:0,usado:0,naFatura:true};
    return{...r,pago:r2(pago),usado:pago>0?r2(pago):r.valor};
  });
}

/* ---------- Resumo do mês ---------- */
function resumo(k){
  const rc=receitas(k),t=txMes(k);
  const salReal=p=>t.filter(x=>x.cls==='salario'&&x.pessoa===p).reduce((s,x)=>s+x.valor,0);
  const sg=salReal('P1'),sl=salReal('P2');
  const outras=t.filter(x=>x.cls==='entrada').reduce((s,x)=>s+x.valor,0);
  const entrouSal=r2((sg||rc.gus)+(sl||rc.lorAd+rc.lorRest)+outras);
  const dec=rc.dec,entrou=r2(entrouSal+dec);
  const fx=fixas(k),fixo=r2(fx.reduce((s,f)=>s+f.usado,0));
  const faturas=r2(t.filter(x=>x.cls==='fatura').reduce((s,x)=>s-x.valor,0));
  const gastos=t.filter(x=>x.cls==='gasto');
  const plan=gastos.filter(x=>x.cat==='Compras planejadas');
  const compras=r2(plan.reduce((s,x)=>s-x.valor,0));
  const estornos=t.filter(x=>x.cls==='estorno').reduce((s,x)=>s+x.valor,0);
  const diaG=gastos.filter(x=>x.cat!=='Compras planejadas'&&x.forma!=='VR/VA'&&x.forma!=='Cartão de crédito');
  const dia=r2(diaG.reduce((s,x)=>s-x.valor,0)-estornos);
  const vrva=r2(gastos.filter(x=>x.forma==='VR/VA').reduce((s,x)=>s-x.valor,0));
  const cartaoCompras=r2(gastos.filter(x=>x.forma==='Cartão de crédito').reduce((s,x)=>s-x.valor,0));
  const faturaGus=r2(t.filter(x=>x.cls==='fatura'&&x.pessoa==='P1').reduce((s,x)=>s-x.valor,0));
  const cartao=Math.max(cartaoCompras,faturaGus);
  const ctl=db.controle[k]||{};
  const guardTx=r2(t.filter(x=>x.cls==='guardado').reduce((s,x)=>s-x.valor,0));
  const guardado=(ctl.guardado!==undefined&&ctl.guardado!==null&&ctl.guardado!=='')?+ctl.guardado:guardTx;
  const prov=provisaoMes(k).tot;
  const total=r2(fixo+faturas+dia);
  const sobrou=r2(entrouSal-total-guardado-prov);
  const sobra13=r2(dec-compras);
  return{k,rc,entrou,entrouSal,dec,compras,sobra13,salPrevisto:!sg||!sl,fixo,faturas,fx,dia,total,guardado,guardTx,prov,sobrou,vrva,benef:rc.benef,vrvaSobra:r2(rc.benef-vrva),cartao,cartaoCompras,faturaGus,ctl};
}

/* ---------- IMPOSTO DE RENDA ---------- */
const IR_ANUAL=[[29145.60,0,0],[33919.80,0.075,2185.92],[45012.60,0.15,4729.91],[55976.16,0.225,8105.85],[Infinity,0.275,10904.66]];
const IR_MENSAL=[[2428.80,0,0],[2826.65,0.075,182.16],[3751.05,0.15,394.16],[4664.68,0.225,675.49],[Infinity,0.275,908.73]];
const IR_LIM={simplificado:17640,educacao:3561.50,dependente:2275.08};
const tabela=(t,b)=>{if(b<=0)return 0;for(const[l,a,d]of t)if(b<=l)return Math.max(0,r2(b*a-d));return 0};
function redutorAnual(rend,imposto){if(rend<=60000)return imposto;if(rend<=88200)return Math.min(imposto,Math.max(0,r2(8429.73-0.095575*rend)));return 0}
function redutorMensal(rend,imposto){if(rend<=5000)return Math.min(imposto,312.89);if(rend<=7350)return Math.min(imposto,Math.max(0,r2(978.62-0.133145*rend)));return 0}
function irDecimo(bruto,inss){const base=bruto-inss,i=tabela(IR_MENSAL,base);return r2(i-redutorMensal(bruto,i))}

// Rendimentos mês a mês de uma pessoa no ano (holerite real quando existe; estimativa no resto)
function irMeses(pessoa,y){
  const c=C(),I=irAno(y)[pessoa],out=[];
  for(let m=1;m<=12;m++){
    const k=kOf(y,m),hol=(db.holerites||{})[pessoa+'|'+k];
    if(hol&&hol.h){const h=hol.h,fd=re=>h.descontos.filter(x=>re.test(x.desc)).reduce((s,x)=>s+x.valor,0);
      out.push({k,fonte:'holerite',rend:h.baseIRRF||h.totProv,inss:fd(/INSS/i),irrf:fd(/IRRF|IMPOSTO DE RENDA/i),saude:fd(/ODONTO|SAUDE|SAÚDE|MEDIC|UNIMED|AMIL|BRADESCO SAUDE/i)});continue}
    if(pessoa==='P1'){
      const adm=new Date(c.admGus+'T00:00'),ay=adm.getFullYear(),am=adm.getMonth()+1;
      if(y<ay||(y===ay&&m<am)){out.push({k,fonte:'outra empresa',rend:0,inss:0,irrf:0,saude:0});continue}
      const bruto=r2(c.brutoGus*Math.pow(1+c.reajGus,nReaj(k,c.mesReajGus)));
      const prop=(y===ay&&m===am)?(31-adm.getDate())/30:1;const rend=r2(bruto*Math.min(1,prop));
      const ref=Object.values(db.holerites||{}).find(x=>x.h&&x.h.nome&&quemE(x.h.nome)==='P1');
      const saude=ref?ref.h.descontos.filter(x=>/ODONTO|SAUDE|SAÚDE/i.test(x.desc)).reduce((s,x)=>s+x.valor,0):0;
      out.push({k,fonte:'estimado',rend,inss:inssCalc(rend,c),irrf:0,saude});
    }else{
      const ativo=m>12-(+I.meses||12);const rend=ativo?r2(+I.bruto||lorBruto(k)):0;
      out.push({k,fonte:ativo?'estimado':'—',rend,inss:ativo?inssCalc(rend,c):0,irrf:0,saude:0});
    }
  }
  return out;
}
function irCalc(pessoa,y){
  const I=irAno(y)[pessoa],M=irMeses(pessoa,y),c=C();
  const outras=I.outras||[];
  const rend=r2(M.reduce((s,x)=>s+x.rend,0)+outras.reduce((s,x)=>s+(+x.rend||0),0));
  const inss=r2(M.reduce((s,x)=>s+x.inss,0)+outras.reduce((s,x)=>s+(+x.inss||0),0));
  const irrf=r2(M.reduce((s,x)=>s+x.irrf,0)+outras.reduce((s,x)=>s+(+x.irrf||0),0)+(+I.irrfExtra||0));
  // saúde e educação vindos das contas da casa atribuídas à pessoa
  const atrib=db.ir.atrib||{};let saudeCasa=0,educ=0;const itensDed=[];
  db.rec.forEach(r=>{const quem=atrib[r.key];if(quem!==pessoa)return;let tot=0;for(let m=1;m<=12;m++){const k=kOf(y,m);if(recAtivas(k).some(x=>x.id===r.id))tot+=r.valor}
    if(r.cat==='Escola/Cursos'){educ+=tot;itensDed.push(['Educação',r.desc,tot])}else if(r.cat==='Saúde'){saudeCasa+=tot;itensDed.push(['Saúde',r.desc,tot])}});
  const txSaude=r2(db.tx.filter(t=>t.data&&t.data.startsWith(String(y))&&t.cls==='gasto'&&t.cat==='Saúde'&&t.pessoa===pessoa).reduce((s,t)=>s-t.valor,0));
  const saudeHol=r2(M.reduce((s,x)=>s+x.saude,0));
  const saude=r2(saudeHol+saudeCasa+txSaude+(+I.saudeExtra||0));
  educ=r2(educ+(+I.educExtra||0));const educD=Math.min(educ,IR_LIM.educacao);
  const dC=r2(inss+saude+educD),baseC=Math.max(0,r2(rend-dC));
  const dS=Math.min(r2(rend*0.2),IR_LIM.simplificado),baseS=Math.max(0,r2(rend-dS));
  const impC0=tabela(IR_ANUAL,baseC),impS0=tabela(IR_ANUAL,baseS);
  const impC=r2(impC0-redutorAnual(rend,impC0)),impS=r2(impS0-redutorAnual(rend,impS0));
  const melhor=impC<impS||(impC===impS&&dC>dS)?'completa':'simplificada',devido=Math.min(impC,impS);
  const d=decimo(y),dec=pessoa==='P1'?{bruto:d.bG,inss:d.iG}:{bruto:d.bL,inss:d.iL};
  const decOutras=outras.reduce((s,x)=>s+(+x.dec||0),0);
  return{M,outras,rend,inss,irrf,saude,saudeHol,saudeCasa,txSaude,educ,educD,itensDed,dC,baseC,dS,baseS,impC,impS,melhor,devido,saldo:r2(devido-irrf),dec,decIR:irDecimo(dec.bruto,dec.inss),decOutras,estimado:M.some(x=>x.fonte==='estimado')};
}

    <p class="note" style="margin-top:6px">Divisão proporcional à renda bruta: P1 ${brl(G.rend)} · P2 ${brl(L.rend)}. Para conferir quem pagou cada conta, importem também os extratos de P2.</p></section>

  ${itens.map(r=>{const ded=r.cat==='Escola/Cursos'||r.cat==='Saúde'||/aluguel/i.test(r.desc);return`<tr><td>${esc(r.desc)}</td><td class="num">${brl(r.tot)}</td><td class="note" style="max-width:360px">${como(r)}</td>
  <td>${ded?`<select class="cell" onchange="db.ir.atrib['${r.key}']=this.value;save();render()"><option value="">escolher</option>${['P1','P2'].map(p=>`<option ${atrib[r.key]===p?'selected':''}>${p}</option>`).join('')}</select>`:'<span class="note">—</span>'}</td></tr>`}).join('')}
  </tbody></table></div>
  <p class="note" style="margin-top:8px">Curso técnico só é dedutível para quem estuda e no nome de quem paga. Cada um faz a própria declaração; colocar o cônjuge como dependente exige somar a renda dele, o que costuma não compensar quando os dois trabalham.</p>

async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}

function lev(a,b){if(Math.abs(a.length-b.length)>2)return 9;const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}

MZ.periodo=(q,padrao='mes')=>{
  const mk=(ks,label,tipo)=>({ks,label,tipo});
  const ano=k=>{const y=+k.slice(0,4),ks=[];for(let m=1;m<=12;m++)ks.push(kOf(y,m));return ks};
  let m;
  if((m=q.match(/ultimos? (\d+|dois|tres|quatro|seis|doze) meses/))){const n={dois:2,tres:3,quatro:4,seis:6,doze:12}[m[1]]||+m[1];const ks=[];for(let i=n-1;i>=0;i--)ks.push(kAdd(mcur(),-i));return mk(ks,`nos últimos ${n} meses`,'faixa')}
  if(/ano que vem|proximo ano/.test(q)){const y=+mcur().slice(0,4)+1;return mk(ano(kOf(y,1)),`em ${y}`,'ano')}
  if(/ano passado/.test(q)){const y=+mcur().slice(0,4)-1;return mk(ano(kOf(y,1)),`em ${y}`,'ano')}
  if((m=q.match(/\b(20\d\d)\b/))&&!M_MESES.some(([a,b])=>new RegExp(`\\b(${a}|${b})\\b`).test(q))){return mk(ano(kOf(+m[1],1)),`em ${m[1]}`,'ano')}
  for(let i=0;i<12;i++){const[a,b]=M_MESES[i];const re=new RegExp(`\\b(${a}|${b})\\b(?:\\s*(?:de|\\/)?\\s*(20\\d\\d|\\d\\d)\\b)?`);const x=q.match(re);
    if(x&&!(b==='mai'&&/\bmais\b/.test(x[0]))){let y=x[2]?(x[2].length===2?2000+ +x[2]:+x[2]):+mcur().slice(0,4);if(!x[2]){const d=kNum(kOf(y,i+1))-kNum(mcur());if(d>5)y--;else if(d<-6)y++}const k=kOf(y,i+1);
      if(/desde|a partir/.test(q)){const ks=[];for(let n=kNum(k);n<=kNum(mcur());n++)ks.push(numK(n));return mk(ks,`desde ${mesCurto(k)}`,'faixa')}
      return mk([k],`em ${mesLongo(k).toLowerCase()}`,'mes')}}
  if(/mes passado|ultimo mes|mes anterior/.test(q)){const k=kAdd(mcur(),-1);return mk([k],`em ${mesLongo(k).toLowerCase()}`,'mes')}
  if(/proximo mes|mes que vem/.test(q)){const k=kAdd(mcur(),1);return mk([k],`em ${mesLongo(k).toLowerCase()}`,'mes')}
  if(/\b(esse|este|nesse|neste|desse|deste|no) ano\b|\bdo ano\b|\bano todo\b|\bno ano\b|por ano|anual/.test(q))return mk(ano(mcur()),`em ${mcur().slice(0,4)}`,'ano');
  if(/\b(esse|este|nesse|neste|desse|deste) mes\b|mes atual|\bhoje\b|\bagora\b|\bdo mes\b|\bno mes\b/.test(q))return mk([mcur()],`em ${mesLongo(mcur()).toLowerCase()}`,'mes');
  if(padrao==='ano')return mk(ano(mcur()),`em ${mcur().slice(0,4)}`,'ano');
  if(padrao==='seis'){const ks=[];for(let i=5;i>=0;i--)ks.push(kAdd(mcur(),-i));return mk(ks,'nos últimos 6 meses','faixa')}
  return mk([mcur()],`em ${mesLongo(mcur()).toLowerCase()}`,'mes');
};

  {k:'planej',l:'compras planejadas',re:/compras planejadas/,setor:'Compras planejadas'},
];
const M_TKW=['ifood','uber','mercado','supermercado','farmacia','restaurante','netflix','aluguel','condominio','internet','celular','transporte','roupas','delivery','curso','oculos'];
MZ.termo=q=>{let t=M_TERMOS.find(t=>t.re.test(q));if(t)return t;
  const q2=q.split(' ').map(w=>{if(w.length<4||M_VOCAB.includes(w)||(typeof M_STOP!=='undefined'&&M_STOP.has(w)))return w;for(const k of M_TKW){const d=lev(w,k);if(d===0||(d===1&&w.length>=4)||(d===2&&w.length>=7&&w[0]===k[0]))return k}return w}).join(' ');
  return M_TERMOS.find(t=>t.re.test(q2))||null};
// itens de gasto de um mês (contas fixas + dia a dia + faturas), com pessoa e setor
MZ.itens=k=>{
  const out=[];
  fixas(k).forEach(f=>{if(f.usado)out.push({k,data:k+'-'+String(f.dia||1).padStart(2,'0'),desc:f.desc,valor:f.usado,pessoa:f.pessoa,setor:setorDe(f.cat,f.desc),cat:f.cat,rec:f.key,tipo:'fixa'})});
  txMes(k).forEach(t=>{
    if(t.cls==='gasto'&&t.forma!=='Cartão de crédito')out.push({k,data:t.data,desc:t.desc,valor:-t.valor,pessoa:t.pessoa,setor:setorDe(t.cat,t.desc),cat:t.cat,forma:t.forma,tipo:'gasto'});
    if(t.cls==='estorno')out.push({k,data:t.data,desc:t.desc,valor:-t.valor,pessoa:t.pessoa,setor:setorDe(t.cat,t.desc),cat:t.cat,tipo:'estorno'});
    if(t.cls==='fatura')out.push({k,data:t.data,desc:t.desc,valor:-t.valor,pessoa:t.pessoa,setor:'Cartões e parcelas',cat:'Fatura do cartão',tipo:'fatura'});
  });
  return out;
};
MZ.filtra=(it,termo,pessoa)=>it.filter(x=>(!pessoa||x.pessoa===pessoa||(x.pessoa==='Casal'&&false))&&(!termo||(termo.rec?x.rec===termo.rec||(termo.re.test(normTxt(x.desc))&&x.tipo!=='fixa'):termo.setor?x.setor===termo.setor:true)));
const soma=a=>r2(a.reduce((s,x)=>s+x.valor,0));

/* ---------- Respostas ---------- */
const A=(html,chart,extra)=>({html,chart,...(extra||{})});
const barra=(ks,vals,label,cor)=>({type:'bar',labels:ks.map(mesCurto),datasets:[{label,data:vals,color:cor||'--money'}]});
const serieMeses=(per,n=6)=>{if(per.ks.length>1)return per.ks;const ks=[];for(let i=n-1;i>=0;i--)ks.push(kAdd(per.ks[0],-i));return ks};
const vazio=t=>`<span class="note">${t}</span>`;

const H={};
H.gastoTermo=(q,ctx)=>{
  const t=ctx.termo,per=MZ.periodo(q,'mes'),p=ctx.pessoa;

  return A(`${conta?`<b>${n}</b> ${t?`lançamento(s) de ${t.l}`:'lançamentos'}`:`<b>${brl(tot)}</b> ${t?`com ${t.l}`:'de gastos'}`} ${p?`(${p})`:''} ${per.label}${conta?` — total de ${brl(tot)}`:n?` em ${n} lançamento(s), média de ${brl(n?tot/n:0)} cada`:''}.
    ${lista.length?`<div class="m-list">${lista.map(x=>`<div><span>${dataBR(x.data)} · ${esc(x.desc.slice(0,42))}</span><b>${brl(x.valor)}</b></div>`).join('')}</div>`:vazio('Nada encontrado nesse período.')}`,
    barra(ks,vals,t?t.l:'Gastos'),{mod:t&&t.rec?'fixas':'gastos'});
};
H.gastoTotal=(q,ctx)=>{

    {type:'doughnut',labels:L.map(x=>x[0]),datasets:[{label:'Gastos',data:L.map(x=>r2(x[1])),colors:L.map(x=>SET_COR[x[0]]||'#999')}]},{mod:'gastos'});
};
H.topSetor=(q,ctx)=>{const per=MZ.periodo(q,'mes');const it=per.ks.flatMap(k=>MZ.filtra(MZ.itens(k),null,ctx.pessoa));const g={};it.forEach(x=>g[x.setor]=(g[x.setor]||0)+x.valor);const L=Object.entries(g).filter(x=>x[1]>0.5).sort((a,b)=>b[1]-a[1]);const tot=soma(it);

    {type:'doughnut',labels:L.map(x=>x[0]),datasets:[{label:'Gastos',data:L.map(x=>r2(x[1])),colors:L.map(x=>SET_COR[x[0]]||'#999')}]},{mod:'gastos'})};
H.maiorGasto=(q,ctx)=>{const per=MZ.periodo(q,'mes');const it=per.ks.flatMap(k=>MZ.filtra(MZ.itens(k),ctx.termo,ctx.pessoa)).filter(x=>x.tipo==='gasto'||(/conta|fixa/.test(q)&&x.tipo==='fixa'));const L=it.sort((a,b)=>b.valor-a.valor).slice(0,5);

    {type:'bar',horizontal:true,labels:L.map(x=>x.desc.slice(0,22)),datasets:[{label:'Valor',data:L.map(x=>x.valor),color:'--dia'}]},{mod:'gastos'})};
H.mediaTermo=(q,ctx)=>{const per=MZ.periodo(q,'seis');const ks=per.ks.filter(k=>kNum(k)<=kNum(TODAY_K));const vals=ks.map(k=>soma(MZ.filtra(MZ.itens(k),ctx.termo,ctx.pessoa)));const com=vals.filter(v=>v>0);const med=com.length?com.reduce((a,b)=>a+b,0)/com.length:0;

H.comparar=(q,ctx)=>{const ms=[];for(const[a,b]of M_MESES){const x=q.match(new RegExp(`\\b(${a}|${b})\\b`,'g'));}
  let ks=[];M_MESES.forEach(([a,b],i)=>{if(new RegExp(`\\b(${a}|${b})\\b`).test(q)){let y=+mcur().slice(0,4);if(kNum(kOf(y,i+1))>kNum(mcur()))y--;ks.push(kOf(y,i+1))}});
  if(ks.length===1&&ks[0]!==mcur())ks.push(mcur());if(ks.length<2)ks=[kAdd(mcur(),-1),mcur()];ks.sort();const v=ks.map(k=>soma(MZ.filtra(MZ.itens(k),ctx.termo,ctx.pessoa)));const d=v[v.length-1]-v[0];
  return A(`${ctx.termo?ctx.termo.l[0].toUpperCase()+ctx.termo.l.slice(1):'Gastos'}: ${ks.map((k,i)=>`${mesCurto(k)} <b>${brl(v[i])}</b>`).join(' × ')}. ${d>0?`Aumentou <b class="neg">${brl(d)}</b>`:d<0?`Caiu <b class="pos">${brl(-d)}</b>`:'Ficou igual'}${v[0]?` (${pct(Math.abs(d)/v[0])})`:''}.`,barra(ks,v,'Gastos'),{mod:'gastos'})};
H.vrva=(q,ctx)=>{const per=MZ.periodo(q,'mes');const rs=per.ks.map(resumo);const rec=rs.reduce((s,r)=>s+r.benef,0),us=rs.reduce((s,r)=>s+r.vrva,0);

H.sobra=(q)=>{const per=MZ.periodo(q,'mes');const rs=per.ks.map(resumo);const s=rs.reduce((a,r)=>a+r.sobrou,0);const fut=kNum(per.ks[0])>kNum(TODAY_K);

  let m,h50=0,h100=0;while((m=re.exec(q))){const h=MZ.horas(m[1])+(m[2]?+m[2]/60:0);if(m[3]==='100')h100+=h;else h50+=h}

function mChart(id,sp){const el=document.getElementById(id);if(!el||!window.Chart||!sp)return;
  const col=c=>c&&c.startsWith('--')?cssv(c):c;const money=sp.money!==false&&!sp.pct;
  const ds=sp.datasets.map(d=>{const base={label:d.label,data:d.data,borderRadius:sp.type==='bar'?6:0,maxBarThickness:46};
    if(sp.type==='doughnut')return{...base,backgroundColor:d.colors,borderColor:cssv('--paper'),borderWidth:2};
    if(d.colorSign)return{...base,backgroundColor:d.data.map(v=>(d.inv?v>0:v<0)?cssv('--stamp'):cssv('--money'))};
    if(sp.type==='line')return{...base,borderColor:col(d.color),backgroundColor:col(d.color),tension:.3,pointRadius:3,borderWidth:2.5};
    return{...base,backgroundColor:col(d.color||'--money')}});
  const fmt=v=>sp.pct?v+'%':money?brl(v):v;
  const opt={responsive:true,maintainAspectRatio:false,animation:{duration:350},plugins:{legend:{display:sp.datasets.length>1||sp.type==='doughnut',position:'bottom',labels:{color:cssv('--ink2'),boxWidth:10,font:{size:11}}},tooltip:{callbacks:{label:c=>`${c.dataset.label}: ${fmt(c.parsed.y!==undefined&&sp.type!=='doughnut'?(sp.horizontal?c.parsed.x:c.parsed.y):c.parsed)}`}}}};
  if(sp.type!=='doughnut'){const sc=baseScales(money);if(sp.pct)sc.y.ticks.callback=v=>v+'%';if(sp.horizontal){opt.indexAxis='y';sc.x={grid:{color:cssv('--line2')},ticks:{color:cssv('--ink3'),callback:v=>money?brl0(v):v}};sc.y={grid:{display:false},ticks:{color:cssv('--ink2'),font:{size:11}}}}
    if(sp.stacked){sc.x.stacked=true;sc.y.stacked=true}opt.scales=sc}else opt.cutout='62%';
  M_CHARTS.push(new Chart(el,{type:sp.type,data:{labels:sp.labels,datasets:ds},options:opt}));
}

MZ.dias=q=>{
  q=q.replace(/dia da semana/g,' ');
  if(!/gast|compr|pag|saiu|sai|pix|uber|\b99\b|ifood|lanc|movim|despes|mercado|restaurante|farmacia|transporte|lazer|cartao|quanto foi/.test(q))return null;
  const T=hojeD();let m;const R=(a,b,label)=>({ini:iso(a),fim:iso(b),label});
  const dm=(d,mo,y)=>{const yy=y?(y.length===2?2000+ +y:+y):T.getFullYear();return new Date(yy,mo-1,+d,12)};
  if((m=q.match(/\b(?:de|entre) (\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))? (?:a|ate|e) (\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/)))return R(dm(m[1],m[2],m[3]),dm(m[4],m[5],m[6]),`de ${m[1]}/${m[2]} a ${m[4]}/${m[5]}`);
  if(/\banteontem\b/.test(q))return R(addD(T,-2),addD(T,-2),'anteontem');
  if(/\bontem\b/.test(q))return R(addD(T,-1),addD(T,-1),'ontem');
  if(/\bhoje\b/.test(q))return R(T,T,'hoje');
  if((m=q.match(/ultimos? (\d+|sete|quinze|trinta) dias/))){const n={sete:7,quinze:15,trinta:30}[m[1]]||+m[1];return R(addD(T,-(n-1)),T,`nos últimos ${n} dias`)}
  const seg=addD(T,-((T.getDay()+6)%7));
  if(/semana passada|ultima semana/.test(q))return R(addD(seg,-7),addD(seg,-1),'na semana passada');
  if(/\b(essa|esta|nessa|nesta|da) semana\b/.test(q))return R(seg,T,'nesta semana');
  if(/fim de semana/.test(q)){const sab=addD(seg,-2);return R(sab,addD(sab,1),'no último fim de semana')}
  if((m=q.match(/\b(?:dia|em|no dia) (\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/))||(m=q.match(/\b(\d{1,2})\/(\d{1,2})\/(\d{2,4})\b/))){const d=dm(m[1],m[2],m[3]);return R(d,d,`em ${String(m[1]).padStart(2,'0')}/${String(m[2]).padStart(2,'0')}`)}
  if((m=q.match(/\bno dia (\d{1,2})\b(?! de )/))){const d=new Date(T.getFullYear(),T.getMonth(),+m[1],12);return R(d,d,`em ${String(m[1]).padStart(2,'0')}/${String(T.getMonth()+1).padStart(2,'0')}`)}
  if(/primeira quinzena/.test(q)){const a=new Date(T.getFullYear(),T.getMonth(),1,12);return R(a,addD(a,14),'na 1ª quinzena')}
  if(/segunda quinzena/.test(q)){const a=new Date(T.getFullYear(),T.getMonth(),16,12);return R(a,new Date(T.getFullYear(),T.getMonth()+1,0,12),'na 2ª quinzena')}
  return null;
};

H.calc=q=>{let e=q.replace(/^(quanto (e|da|fica)|calcula(r)?|conta)\s*/,'').replace(/\bx\b|\bvezes\b/g,'*').replace(/\bmais\b/g,'+').replace(/\bmenos\b/g,'-').replace(/\bdividido por\b/g,'/').replace(/(\d+(?:,\d+)?)\s*(%|por cento) de\s*(\d+(?:,\d+)?)/g,'($1/100*$3)').replace(/(\d),(\d)/g,'$1.$2').replace(/\s+/g,'');

H.porDia=(q)=>{const k=mcur(),r=resumo(k),T=hojeD(),fim=new Date(T.getFullYear(),T.getMonth()+1,0).getDate(),rest=fim-T.getDate()+1;const livre=Math.max(0,r.sobrou);

H.juntar=(q,ctx)=>{const mt=MZ.meta(q);const ns=[...q.matchAll(new RegExp(nRe,'g'))].map(x=>num(x[1])).filter(v=>v>=10);

H.porque=(q,ctx)=>{const per=MZ.periodo(q,'mes'),k=per.ks[0],a=kAdd(k,-1);const ra=resumo(a),rb=resumo(k);const d=rb.sobrou-ra.sobrou;
  const it=x=>{const g={};MZ.itens(x).forEach(i=>g[i.setor]=(g[i.setor]||0)+i.valor);return g};const ga=it(a),gb=it(k);const dif=[...new Set([...Object.keys(ga),...Object.keys(gb)])].map(s=>[s,r2((gb[s]||0)-(ga[s]||0))]).filter(x=>Math.abs(x[1])>1).sort((x,y)=>Math.abs(y[1])-Math.abs(x[1])).slice(0,5);

H.semana=(q,ctx)=>{const per=MZ.periodo(q,'seis');const g=[0,0,0,0,0,0,0],n=[0,0,0,0,0,0,0];per.ks.flatMap(k=>MZ.filtra(MZ.itens(k),ctx.termo,ctx.pessoa)).filter(x=>x.tipo==='gasto').forEach(x=>{const w=new Date(x.data+'T12:00').getDay();g[w]+=x.valor;n[w]++});

H.dicas=(q)=>{const k=mcur(),r=resumo(k),c=C(),L=[];const med=t=>{const ks=[];for(let i=2;i>=0;i--)ks.push(kAdd(k,-i));return somaIt(ks,t,null)/3};

  const d13=decimo(+k.slice(0,4)),c13=db.metas.filter(m=>m.fonte==='13º'&&!m.comprado).reduce((s,m)=>s+m.valor,0);if(c13>d13.total)L.push(`As compras planejadas com o 13º somam ${brl(c13)}, mas o 13º do casal é ${brl(d13.total)}. Vale adiar uma delas.`);

/* ---- roteamento extra (antes das regras antigas) ---- */
{const _rota=MZ.rota;MZ.rota=q=>{const t=MZ.termo(q),pessoa=MZ.pessoa(q),ctx={termo:t,pessoa};const P=[
  [/^(oi|ola|ola merlin|oi merlin|bom dia|boa tarde|boa noite|e ai|hey|opa)\b/,H.oi],
  [/^(obrigad\w*|valeu|vlw|brigad\w*|otimo|muito bom|massa)\b/,H.valeu],
  [/como (anda|esta|vai|ta|estao) (?:a |as |o )?(?:nossa |nossas |minha |minhas |nosso )?(grana|financas|vida financeira|conta|coisas|dinheiro)|situacao financeira|como estamos de dinheiro/,H.statusMes],
  [q=>/gast|compr/.test(q)&&!MZ.termo(q)&&!MZ.meta(q)&&!!MZ.naoAchou(q),H.naoAchou],
  [/(fiz|fizemos|fez) (de )?errado|o que (deu|esta|ta) errado|(onde|o que) (eu |nos |a gente )?(errei|erramos|errou) (esse|este|neste|nesse|no) mes|errando|pontos? (de atencao|fracos?)|o que (posso|devo|precisamos) (melhorar|mudar)/,H.dicas],
  [q=>!/quem|por ?que|porque/.test(q)&&/gast(ei|amos|ando|ou|aram) (de )?(demais|muito|mais|a toa|errado)|(estou|estamos|to|tamos|tou) gastando (muito|demais)|desperdic|(a gente|nos|eu) (ta|esta|estamos|estou|to) (bem|mal)|(estamos|to|estou|tamos) (bem|mal)( de dinheiro)?$|(fiz|fizemos) (algo|alguma coisa) (certo|certa)|acert(ei|amos) (esse|este|neste|nesse) mes|avalia(cao|r)? (do|o) mes|nota (do|pro) mes/.test(q),H.avaliacao],
  [/^(ajuda|help|o que (voce|vc) (sabe|faz)|como (te )?uso|comandos)\b/,H.ajuda],
  [q=>/^(quanto (e|da|fica)|calcula|conta)?\s*[\d.,]+\s*(\+|-|\*|\/|x|vezes|mais|menos|dividido por|%|por cento)\s*/.test(q)&&!/hora|extra|gast/.test(q),H.calc],
  [/quem (gastou|gasta|gastamos|esta gastando) mais|\beu ou (a )?p2\b|p2 ou eu|p1 ou (a )?p2|p2 ou (o )?p1|cada um gast/,H.quem],
  [q=>/dica|economiz(ar|o)|conselho|como (melhorar|guardar mais|gastar menos)|o que (posso|devo) melhorar|analise (as |minhas )?financ/.test(q)&&!/se (eu |a gente |nos )?(cortar|reduzir|diminuir|parar)/.test(q),H.dicas],
  [/se (eu |a gente |nos |a p2 )?(cortar|reduzir|diminuir|parar|economizar)|sem (o |a )?(uber|ifood)|cortando/,H.economia],
  [/em quanto tempo|quantos meses (para|pra|eu|a gente|levo|vou)|quanto tempo (para|pra|levo)|juntar \d|junto \d/,H.juntar],
  [/(quanto|o que) (posso|podemos|da pra|da para) gastar|por dia ate o fim|orcamento (do|por) dia|limite por dia/,H.porDia],
  [/por ?que|porque|explica|motivo/,q=>/sobr|gast|sobra|economi/.test(q)?H.porque:null],
  [/dia da semana/,H.semana],
  [/compar(ado|ando|ar|e)? (com|a|ao)\b|\bversus\b|\bvs\b|em relacao a/,H.comparar],
  [/top \d+|\d+ maiores/,H.top],
  [/(acima|abaixo|mais|menos|maior(es)?|menor(es)?|superior(es)?) (de|que|a) (r )?\d/,q=>/gast|compr|pix|lanc|despes/.test(q)?H.acima:null],
  [q=>MZ.termos(q).length>=2&&/gast|quanto|compar/.test(q)&&!/quem/.test(q),H.multi],
];
  for(const[re,h]of P){const ok=typeof re==='function'?re(q):re.test(q);if(!ok)continue;const fn=h.length===1&&!H[Object.keys(H).find(k=>H[k]===h)]?h(q):h;if(fn)return{fn,ctx}}
  return _rota(q)}}

/* ---- catálogo: semelhança para não dizer "não entendi" ---- */
MZ.semelhante=q=>{const w=new Set(q.split(' ').filter(x=>x.length>2&&!M_STOP.has(x)));if(!w.size)return null;let best=null,bs=0;
  MERLIN_CAT.forEach(c=>c.p.forEach(p=>{const pw=new Set(MZ.norm(p).split(' ').filter(x=>x.length>2&&!M_STOP.has(x)));let i=0;w.forEach(x=>{if(pw.has(x))i++});const s=i/Math.max(w.size,1)*(i/Math.max(pw.size,1))**.5;if(s>bs){bs=s;best=p}}));return bs>=.55?best:null};

/* ---- responder com dias + semelhança + IA ---- */
{const _resp=MZ.responder;MZ.responder=texto=>{const q=MZ.norm(texto);MZ._dia=MZ.dias(q);
  try{let r=_resp(texto);if(!r.h){const s=MZ.semelhante(MZ.fix(q));if(s){const r2_=_resp(s);if(r2_.h){r2_.html=`<span class="note">Entendi como: “${esc(s)}”</span><br>`+r2_.html;r=r2_}}}
    if(r.sug)r.sugestoes=r.sug;return r}finally{MZ._dia=null}}}

  const hist=(MZ.histIA||[]).slice(-6);
  const sys=`Você é o Mago Merlin, assistente financeiro do app CasaFinance de um casal brasileiro. Responda em português do Brasil, de forma curta e direta (2 a 5 frases), com valores em R$ no formato brasileiro. Use SOMENTE os dados em JSON abaixo; se faltar dado, diga o que falta. Não invente. Negrite o número principal com <b></b>. Não é consultoria financeira profissional.
Responda SOMENTE com um JSON válido, sem texto fora dele: {"texto":"...","grafico":null ou {"type":"bar"|"line"|"doughnut","labels":[...],"datasets":[{"label":"...","data":[números]}]}}. Inclua gráfico quando ajudar.
DADOS: ${JSON.stringify(MZ.contexto())}`;

let ctpsPessoa='P1',ctpsRev=null;
const CT_MONEY=/R?\$?\s*(\d{1,3}(?:\.\d{3})*,\d{2}|\d+,\d{2})/;
const ctMoney=s=>{const m=String(s||'').match(CT_MONEY);return m?+m[1].replace(/\./g,'').replace(',','.'):0};
const ctDate=s=>{const m=String(s||'').match(/(\d{2})[\/.-](\d{2})[\/.-](\d{4})/);return m?`${m[3]}-${m[2]}-${m[1]}`:''};
const ctDates=s=>[...String(s||'').matchAll(/(\d{2})[\/.-](\d{2})[\/.-](\d{4})/g)].map(m=>`${m[3]}-${m[2]}-${m[1]}`);
const CT_CNPJ=/\b\d{2}\.?\d{3}\.?\d{3}\/?\d{4}-?\d{2}\b/;

function parseCTPS(text){
  const L=String(text).split(/\r?\n/).map(s=>s.replace(/\s+/g,' ').trim()).filter(Boolean);
  const isEmp=l=>/^(nome do )?(empregador|raz[aã]o social|empresa)\b/i.test(l);
  let starts=L.map((l,i)=>isEmp(l)?i:-1).filter(i=>i>=0);
  if(!starts.length){starts=[];L.forEach((l,i)=>{if(CT_CNPJ.test(l)&&!starts.some(s=>i-s<5))starts.push(Math.max(0,i-1))})}
  if(!starts.length){starts=[];L.forEach((l,i)=>{if(/admiss/i.test(l))starts.push(Math.max(0,i-3))})}
  const out=[];
  starts.forEach((s,bi)=>{const B=L.slice(s,starts[bi+1]??L.length);
    const val=re=>{const i=B.findIndex(l=>re.test(l));if(i<0)return'';const rest=B[i].replace(re,'').replace(/^[\s:–-]+/,'').trim();return rest||B[i+1]||''};
    let empresa=val(/^(nome do )?(empregador|raz[aã]o social|empresa)\s*:?/i).replace(CT_CNPJ,'').replace(/CNPJ.*$/i,'').replace(/[:–-]+$/,'').trim();
    if(!empresa){const i=B.findIndex(l=>CT_CNPJ.test(l));empresa=(i>0?B[i-1]:B[0]).replace(CT_CNPJ,'').trim()}
    const cnpj=(B.join(' ').match(CT_CNPJ)||[''])[0];
    const adm=ctDate(val(/admiss[aã]o\s*:?/i))||ctDate(val(/in[ií]cio\s*:?/i))||ctDates(B.join(' '))[0]||'';
    const sd=val(/(desligamento|sa[ií]da|t[eé]rmino|rescis[aã]o|demiss[aã]o|fim do contrato|data fim)\s*:?/i);const saida=ctDate(sd);
    const cargo=val(/(cargo|ocupa[cç][aã]o|fun[cç][aã]o)\s*:?/i).replace(/CBO.*$/i,'').replace(/\b\d{4}-?\d{2}\b/,'').replace(/[:–-]+$/,'').trim();
    const sal=ctMoney(val(/(remunera[cç][aã]o( contratual| inicial)?|sal[aá]rio( contratual| inicial| base)?)\s*:?/i));
    const alt=[];B.forEach(l=>{const d=ctDate(l),v=ctMoney(l);if(d&&v&&!/admiss|deslig|sa[ií]da/i.test(l))alt.push({data:d,valor:v,motivo:/dissidio|diss[ií]dio|conven/i.test(l)?'Dissídio':/promo/i.test(l)?'Promoção':/merit|m[eé]rito/i.test(l)?'Mérito':'Alteração'})});
    if(!adm||!empresa)return;
    const salarios=[];if(sal)salarios.push({data:adm,valor:sal,motivo:'Admissão'});alt.forEach(a=>{if(!salarios.some(x=>x.data===a.data&&x.valor===a.valor))salarios.push(a)});
    salarios.sort((a,b)=>a.data.localeCompare(b.data));
    out.push({empresa:empresa.slice(0,80),cnpj,cargo:cargo.slice(0,60),adm,saida,salarios})});
  return out;
}

async function lerCTPS(files){files=Array.from(files||[]);const el=document.getElementById('ct-status'),st=t=>{if(el)el.textContent=t};const achados=[];let dono=null;
  for(const f of files){try{st(`Lendo ${f.name}…`);let text='';
      if(/\.pdf$/i.test(f.name)){const buf=new Uint8Array(await f.arrayBuffer());text=(await pdfLines(buf.slice())).join('\n');if(text.replace(/\s/g,'').length<80)text=await ocrImagens(await pdfCanvases(buf),st)}
      else text=await ocrImagens([f],st);
      dono=dono||quemE(text);parseCTPS(text).forEach(x=>achados.push(x))}catch(e){st('Não consegui ler '+f.name+': '+e.message);return}}
  if(dono)ctpsPessoa=dono;
  ctpsRev=achados.length?achados:[{empresa:'',cnpj:'',cargo:'',adm:'',saida:'',salarios:[{data:'',valor:0,motivo:'Admissão'}]}];
  st(achados.length?`Encontrei ${achados.length} contrato(s)${dono?` de ${dono}`:''}. Confira abaixo e salve.`:'Não reconheci os contratos automaticamente — preencha abaixo.');render()}

function ctLista(p){return(db.ctps||[]).filter(j=>(j.pessoa||'P1')===p).sort((a,b)=>a.adm.localeCompare(b.adm))}
function ctAtual(j,p){return!j.saida&&p==='P1'&&+C().brutoGus>0}
function ctSalario(j,dia){const s=(j.salarios||[]).filter(x=>x.valor&&x.data<=dia).sort((a,b)=>a.data.localeCompare(b.data));return s.length?s[s.length-1].valor:((j.salarios||[]).find(x=>x.valor)||{}).valor||0}
function ctBrutoPrev(k){const c=C();return r2(c.brutoGus*Math.pow(1+c.reajGus,nReaj(k,c.mesReajGus)))}
function ctSerie(p){const J=ctLista(p);if(!J.length)return{ks:[],real:[],prev:[]};
  const ini=J[0].adm.slice(0,7),fim=p==='P1'?'2028-12':TODAY_K,ks=[],real=[],prev=[];
  for(let n=kNum(ini);n<=kNum(fim);n++){const k=numK(n),d0=k+'-01',d1=k+'-31';const j=J.slice().reverse().find(x=>x.adm<=d1&&(!x.saida||x.saida>=d0));ks.push(k);
    if(!j){real.push(null);prev.push(null);continue}
    let v=ctSalario(j,d1);if(ctAtual(j,p))v=Math.max(v,ctBrutoPrev(k));
    if(kNum(k)>kNum(TODAY_K)){real.push(null);prev.push(r2(v))}else{real.push(r2(v));prev.push(kNum(k)===kNum(TODAY_K)?r2(v):null)}}
  return{ks,real,prev}}
function ctResumo(p){const J=ctLista(p);const jobs=J.map((j,i)=>{const ini=(j.salarios||[]).find(x=>x.valor)?.valor||0;let fim=ctSalario(j,j.saida||iso(hojeD()));if(ctAtual(j,p))fim=Math.max(fim,C().brutoGus);
    const fimD=j.saida||iso(hojeD());const meses=Math.max(0,Math.round((new Date(fimD)-new Date(j.adm))/2629800000));
    return{...j,i,ini,fim,meses,pct:ini?fim/ini-1:0}});
  jobs.forEach((j,i)=>{const a=jobs[i-1];j.troca=a&&a.fim&&j.ini?j.ini/a.fim-1:null});
  const comSal=jobs.filter(j=>j.ini);const primeiro=comSal[0],ult=comSal[comSal.length-1];
  const anos=primeiro?Math.max(.1,(new Date()-new Date(primeiro.adm))/31557600000):0;const total=primeiro&&ult?ult.fim/primeiro.ini-1:0;
  const mesesCart=jobs.reduce((s,j)=>s+j.meses,0);
  return{jobs,primeiro,ult,total,cagr:primeiro&&anos>=1?Math.pow(1+total,1/anos)-1:null,anos,mesesCart}}
const ctDur=m=>m>=12?`${Math.floor(m/12)} ano${m>=24?'s':''}${m%12?` e ${m%12} m`:''}`:`${m} ${m===1?'mês':'meses'}`;
