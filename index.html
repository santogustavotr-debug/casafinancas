  let m,h50=0,h100=0;while((m=re.exec(q))){const h=MZ.horas(m[1])+(m[2]?+m[2]/60:0);if(m[3]==='100')h100+=h;else h50+=h}

  // INSS marginal sobre o salário bruto do mês

    {type:'bar',stacked:true,labels:['Hora extra'],datasets:[{label:'50%',data:[v50],color:'--gus'},{label:'100%',data:[v100],color:'--lor'},{label:'DSR',data:[dsr],color:'--money'}],horizontal:true},{mod:'holerite'})};

    if(novaPes)base=base.replace(/\b(a |o )?(lorena|gustavo|eu|ela|meu|minha|gastei|gastou)\b/g,' gastamos ');
    const q3=(base+' '+q.replace(/^e\b/,'')).replace(/\s+/g,' ').trim();const r3=MZ.rota(q3);if(r3){q=q3;r=r3}}

};

const M_CHARTS=[];let M_N=0;
function mChart(id,sp){const el=document.getElementById(id);if(!el||!window.Chart||!sp)return;
  const col=c=>c&&c.startsWith('--')?cssv(c):c;const money=sp.money!==false&&!sp.pct;
  const ds=sp.datasets.map(d=>{const base={label:d.label,data:d.data,borderRadius:sp.type==='bar'?6:0,maxBarThickness:46};
    if(sp.type==='doughnut')return{...base,backgroundColor:d.colors,borderColor:cssv('--paper'),borderWidth:2};
    if(d.colorSign)return{...base,backgroundColor:d.data.map(v=>(d.inv?v>0:v<0)?cssv('--stamp'):cssv('--money'))};
    if(sp.type==='line')return{...base,borderColor:col(d.color),backgroundColor:col(d.color),tension:.3,pointRadius:3,borderWidth:2.5};
    return{...base,backgroundColor:col(d.color||'--money')}});
  const fmt=v=>sp.pct?v+'%':money?brl(v):v;
  const opt={responsive:true,maintainAspectRatio:false,animation:{duration:350},plugins:{legend:{display:sp.datasets.length>1||sp.type==='doughnut',position:'bottom',labels:{color:cssv('--ink2'),boxWidth:10,font:{size:11}}},tooltip:{callbacks:{label:c=>`${c.dataset.label}: ${fmt(c.parsed.y!==undefined&&sp.type!=='doughnut'?(sp.horizontal?c.parsed.x:c.parsed.y):c.parsed)}`}}}};
  if(sp.type!=='doughnut'){const sc=baseScales(money);if(sp.pct)sc.y.ticks.callback=v=>v+'%';if(sp.horizontal){opt.indexAxis='y';sc.x={grid:{color:cssv('--line2')},ticks:{color:cssv('--ink3'),callback:v=>money?brl0(v):v}};sc.y={grid:{display:false},ticks:{color:cssv('--ink2'),font:{size:11}}}}
    if(sp.stacked){sc.x.stacked=true;sc.y.stacked=true}opt.scales=sc}else opt.cutout='62%';
  M_CHARTS.push(new Chart(el,{type:sp.type,data:{labels:sp.labels,datasets:ds},options:opt}));
}

const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const hojeD=()=>{const d=new Date();d.setHours(12,0,0,0);return d};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const nRe='(\\d+(?:[,.]\\d+)?)';const num=s=>+String(s).replace(/\./g,'').replace(',','.');

/* ---- períodos em dias: hoje, ontem, semana, últimos N dias, dia 07/11, de 01/11 a 07/11 ---- */
MZ.dias=q=>{
  q=q.replace(/dia da semana/g,' ');
  if(!/gast|compr|pag|saiu|sai|pix|uber|\b99\b|ifood|lanc|movim|despes|mercado|restaurante|farmacia|transporte|lazer|cartao|quanto foi/.test(q))return null;
  const T=hojeD();let m;const R=(a,b,label)=>({ini:iso(a),fim:iso(b),label});
  const dm=(d,mo,y)=>{const yy=y?(y.length===2?2000+ +y:+y):T.getFullYear();return new Date(yy,mo-1,+d,12)};
  if((m=q.match(/\b(?:de|entre) (\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))? (?:a|ate|e) (\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/)))return R(dm(m[1],m[2],m[3]),dm(m[4],m[5],m[6]),`de ${m[1]}/${m[2]} a ${m[4]}/${m[5]}`);
  if(/\banteontem\b/.test(q))return R(addD(T,-2),addD(T,-2),'anteontem');

MZ.semelhante=q=>{const w=new Set(q.split(' ').filter(x=>x.length>2&&!M_STOP.has(x)));if(!w.size)return null;let best=null,bs=0;

{const _resp=MZ.responder;MZ.responder=texto=>{const q=MZ.norm(texto);MZ._dia=MZ.dias(q);

let ctpsPessoa='Gustavo',ctpsRev=null;
const CT_MONEY=/R?\$?\s*(\d{1,3}(?:\.\d{3})*,\d{2}|\d+,\d{2})/;
const ctMoney=s=>{const m=String(s||'').match(CT_MONEY);return m?+m[1].replace(/\./g,'').replace(',','.'):0};
const ctDate=s=>{const m=String(s||'').match(/(\d{2})[\/.-](\d{2})[\/.-](\d{4})/);return m?`${m[3]}-${m[2]}-${m[1]}`:''};
const ctDates=s=>[...String(s||'').matchAll(/(\d{2})[\/.-](\d{2})[\/.-](\d{4})/g)].map(m=>`${m[3]}-${m[2]}-${m[1]}`);
const CT_CNPJ=/\b\d{2}\.?\d{3}\.?\d{3}\/?\d{4}-?\d{2}\b/;

function parseCTPS(text){
  const L=String(text).split(/\r?\n/).map(s=>s.replace(/\s+/g,' ').trim()).filter(Boolean);
  const isEmp=l=>/^(nome do )?(empregador|raz[aã]o social|empresa)\b/i.test(l);
  let starts=L.map((l,i)=>isEmp(l)?i:-1).filter(i=>i>=0);
  if(!starts.length){starts=[];L.forEach((l,i)=>{if(CT_CNPJ.test(l)&&!starts.some(s=>i-s<5))starts.push(Math.max(0,i-1))})}
  if(!starts.length){starts=[];L.forEach((l,i)=>{if(/admiss/i.test(l))starts.push(Math.max(0,i-3))})}
  const out=[];
  starts.forEach((s,bi)=>{const B=L.slice(s,starts[bi+1]??L.length);
    const val=re=>{const i=B.findIndex(l=>re.test(l));if(i<0)return'';const rest=B[i].replace(re,'').replace(/^[\s:–-]+/,'').trim();return rest||B[i+1]||''};
    let empresa=val(/^(nome do )?(empregador|raz[aã]o social|empresa)\s*:?/i).replace(CT_CNPJ,'').replace(/CNPJ.*$/i,'').replace(/[:–-]+$/,'').trim();
    if(!empresa){const i=B.findIndex(l=>CT_CNPJ.test(l));empresa=(i>0?B[i-1]:B[0]).replace(CT_CNPJ,'').trim()}
    const cnpj=(B.join(' ').match(CT_CNPJ)||[''])[0];
    const adm=ctDate(val(/admiss[aã]o\s*:?/i))||ctDate(val(/in[ií]cio\s*:?/i))||ctDates(B.join(' '))[0]||'';
    const sd=val(/(desligamento|sa[ií]da|t[eé]rmino|rescis[aã]o|demiss[aã]o|fim do contrato|data fim)\s*:?/i);const saida=ctDate(sd);
    const cargo=val(/(cargo|ocupa[cç][aã]o|fun[cç][aã]o)\s*:?/i).replace(/CBO.*$/i,'').replace(/\b\d{4}-?\d{2}\b/,'').replace(/[:–-]+$/,'').trim();
    const sal=ctMoney(val(/(remunera[cç][aã]o( contratual| inicial)?|sal[aá]rio( contratual| inicial| base)?)\s*:?/i));
    const alt=[];B.forEach(l=>{const d=ctDate(l),v=ctMoney(l);if(d&&v&&!/admiss|deslig|sa[ií]da/i.test(l))alt.push({data:d,valor:v,motivo:/dissidio|diss[ií]dio|conven/i.test(l)?'Dissídio':/promo/i.test(l)?'Promoção':/merit|m[eé]rito/i.test(l)?'Mérito':'Alteração'})});
    if(!adm||!empresa)return;
    const salarios=[];if(sal)salarios.push({data:adm,valor:sal,motivo:'Admissão'});alt.forEach(a=>{if(!salarios.some(x=>x.data===a.data&&x.valor===a.valor))salarios.push(a)});
    salarios.sort((a,b)=>a.data.localeCompare(b.data));
    out.push({empresa:empresa.slice(0,80),cnpj,cargo:cargo.slice(0,60),adm,saida,salarios})});
  return out;
}

async function lerCTPS(files){files=Array.from(files||[]);const el=document.getElementById('ct-status'),st=t=>{if(el)el.textContent=t};const achados=[];let dono=null;
  for(const f of files){try{st(`Lendo ${f.name}…`);let text='';
      if(/\.pdf$/i.test(f.name)){const buf=new Uint8Array(await f.arrayBuffer());text=(await pdfLines(buf.slice())).join('\n');if(text.replace(/\s/g,'').length<80)text=await ocrImagens(await pdfCanvases(buf),st)}
      else text=await ocrImagens([f],st);
      dono=dono||quemE(text);parseCTPS(text).forEach(x=>achados.push(x))}catch(e){st('Não consegui ler '+f.name+': '+e.message);return}}
  if(dono)ctpsPessoa=dono;
  ctpsRev=achados.length?achados:[{empresa:'',cnpj:'',cargo:'',adm:'',saida:'',salarios:[{data:'',valor:0,motivo:'Admissão'}]}];
  st(achados.length?`Encontrei ${achados.length} contrato(s)${dono?` de ${dono}`:''}. Confira abaixo e salve.`:'Não reconheci os contratos automaticamente — preencha abaixo.');render()}

function ctLista(p){return(db.ctps||[]).filter(j=>(j.pessoa||'Gustavo')===p).sort((a,b)=>a.adm.localeCompare(b.adm))}
function ctAtual(j,p){return!j.saida&&p==='Gustavo'&&/hosken/i.test(j.empresa)}
function ctSalario(j,dia){const s=(j.salarios||[]).filter(x=>x.valor&&x.data<=dia).sort((a,b)=>a.data.localeCompare(b.data));return s.length?s[s.length-1].valor:((j.salarios||[]).find(x=>x.valor)||{}).valor||0}
function ctBrutoPrev(k){const c=C();return r2(c.brutoGus*Math.pow(1+c.reajGus,nReaj(k,c.mesReajGus)))}
function ctSerie(p){const J=ctLista(p);if(!J.length)return{ks:[],real:[],prev:[]};
  const ini=J[0].adm.slice(0,7),fim=p==='Gustavo'?'2028-12':TODAY_K,ks=[],real=[],prev=[];
  for(let n=kNum(ini);n<=kNum(fim);n++){const k=numK(n),d0=k+'-01',d1=k+'-31';const j=J.slice().reverse().find(x=>x.adm<=d1&&(!x.saida||x.saida>=d0));ks.push(k);
    if(!j){real.push(null);prev.push(null);continue}
    let v=ctSalario(j,d1);if(ctAtual(j,p))v=Math.max(v,ctBrutoPrev(k));
    if(kNum(k)>kNum(TODAY_K)){real.push(null);prev.push(r2(v))}else{real.push(r2(v));prev.push(kNum(k)===kNum(TODAY_K)?r2(v):null)}}
  return{ks,real,prev}}
function ctResumo(p){const J=ctLista(p);const jobs=J.map((j,i)=>{const ini=(j.salarios||[]).find(x=>x.valor)?.valor||0;let fim=ctSalario(j,j.saida||iso(hojeD()));if(ctAtual(j,p))fim=Math.max(fim,C().brutoGus);
    const fimD=j.saida||iso(hojeD());const meses=Math.max(0,Math.round((new Date(fimD)-new Date(j.adm))/2629800000));
    return{...j,i,ini,fim,meses,pct:ini?fim/ini-1:0}});
  jobs.forEach((j,i)=>{const a=jobs[i-1];j.troca=a&&a.fim&&j.ini?j.ini/a.fim-1:null});
  const comSal=jobs.filter(j=>j.ini);const primeiro=comSal[0],ult=comSal[comSal.length-1];
  const anos=primeiro?Math.max(.1,(new Date()-new Date(primeiro.adm))/31557600000):0;const total=primeiro&&ult?ult.fim/primeiro.ini-1:0;
  const mesesCart=jobs.reduce((s,j)=>s+j.meses,0);
  return{jobs,primeiro,ult,total,cagr:primeiro&&anos>=1?Math.pow(1+total,1/anos)-1:null,anos,mesesCart}}
const ctDur=m=>m>=12?`${Math.floor(m/12)} ano${m>=24?'s':''}${m%12?` e ${m%12} m`:''}`:`${m} ${m===1?'mês':'meses'}`;

  else txt=`${p==='Gustavo'?'Você começou':'Lorena começou'} ganhando <b>${brl(R.primeiro?.ini||0)}</b> (${esc(R.primeiro?.empresa||'')}, ${mesCurto((R.primeiro?.adm||'').slice(0,7))}) e hoje ${p==='Gustavo'?'ganha':'ganha'} <b>${brl(R.ult?.fim||0)}</b> bruto: <b class="pos">+${pct(R.total)}</b>${R.cagr!=null?`, média de ${pct(R.cagr)} ao ano`:''}.${p==='Gustavo'?` Com os reajustes previstos, em dez/2028 chega a <b>${brl(ctBrutoPrev('2028-12'))}</b>.`:''}<div class="m-list">${R.jobs.slice().reverse().map(j=>`<div><span>${esc(j.empresa.split(' ').slice(0,2).join(' '))} · ${ctDur(j.meses)}</span><b>${j.ini?brl(j.ini)+' → '+brl(j.fim):'–'}</b></div>`).join('')}</div>`;
  const ks=S.ks.filter((_,i)=>i%Math.max(1,Math.ceil(S.ks.length/40))===0||i===S.ks.length-1);
  return A(txt,{type:'line',labels:ks.map(mesCurto),datasets:[{label:'Salário bruto',data:ks.map(k=>{const i=S.ks.indexOf(k);return S.real[i]??S.prev[i]??0}),color:'--money'}]},{mod:'holerite'})};

const NV_KEY='cfNuvem',NV_LIB='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js';
const NV={cli:null,user:null,status:'off',msg:'',conflito:null,timer:null,canal:null,versoes:null,pulling:false};
function nvCfg(){try{return Object.assign({url:'',chave:'',casa:'casa-luiz-lorena',emailG:'',emailL:'',rev:0,sujo:false,ultimo:''},JSON.parse(localStorage.getItem(NV_KEY)||'{}'))}catch(e){return{url:'',chave:'',casa:'casa-luiz-lorena',emailG:'',emailL:'',rev:0,sujo:false,ultimo:''}}}
function nvSet(p){const c=Object.assign(nvCfg(),p);try{localStorage.setItem(NV_KEY,JSON.stringify(c))}catch(e){}return c}
function nvStatus(s,msg){NV.status=s;NV.msg=msg||'';const el=document.getElementById('nv-chip');if(el){el.className='nv-chip '+s;el.innerHTML=nvChipTxt()}const p=document.getElementById('nv-st');if(p)p.innerHTML=nvChipTxt()}
function nvChipTxt(){const c=nvCfg();return{off:'Só neste aparelho',login:'Entrar na nuvem',sync:'Sincronizando…',ok:`Salvo na nuvem${c.ultimo?' · '+new Date(c.ultimo).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):''}`,offline:'Sem internet — salvo no aparelho',erro:'Erro na nuvem',conflito:'Conflito — escolha a versão'}[NV.status]+(NV.msg&&NV.status==='erro'?`: ${esc(NV.msg)}`:'')}
function nvLib(){return window.supabase?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement('script');s.src=NV_LIB;s.onload=ok;s.onerror=()=>no(new Error('não carregou a biblioteca do Supabase'));document.head.appendChild(s)})}
async function nvIniciar(){const c=nvCfg();if(!c.url||!c.chave){nvStatus('off');return}
  try{await nvLib();NV.cli=window.supabase.createClient(c.url,c.chave,{auth:{persistSession:true,storageKey:'cfNuvemAuth'}});
    const{data}=await NV.cli.auth.getSession();NV.user=data&&data.session?data.session.user:null;
    NV.cli.auth.onAuthStateChange((_e,s)=>{const u=s?s.user:null;if((u&&u.id)!==(NV.user&&NV.user.id)){NV.user=u;if(u)nvPuxar();else nvStatus('login');if(page==='ajustes')render()}});
    if(!NV.user){nvStatus('login');return}
    await nvPuxar();nvOuvir()}catch(e){nvStatus(navigator.onLine?'erro':'offline',e.message)}}
function nvAplicar(remoto){try{localStorage.setItem(KEY,JSON.stringify(remoto.dados))}catch(e){}db=load();save0();nvSet({rev:remoto.rev,sujo:false,ultimo:remoto.atualizado_em});render()}
async function nvPuxar(){if(!NV.cli||!NV.user||NV.pulling)return;NV.pulling=true;nvStatus('sync');const c=nvCfg();
  try{const{data:r,error}=await NV.cli.from('casas').select('*').eq('id',c.casa).maybeSingle();if(error)throw error;
    if(!r){const{data:n,error:e2}=await NV.cli.from('casas').insert({id:c.casa,dados:db,rev:1,atualizado_por:NV.user.email}).select().single();if(e2)throw e2;nvSet({rev:1,sujo:false,ultimo:n.atualizado_em});nvStatus('ok');toast('Dados enviados para a nuvem');return}
    if(r.rev>c.rev){if(c.sujo){NV.conflito=r;nvStatus('conflito');render();return}nvAplicar(r);nvStatus('ok');toast(`Atualizado da nuvem (${r.atualizado_por||''})`);return}
    if(c.sujo)await nvEnviar(true);else nvStatus('ok')}
  catch(e){nvStatus(navigator.onLine?'erro':'offline',e.message||String(e))}finally{NV.pulling=false}}
async function nvEnviar(ja){if(!NV.cli||!NV.user)return;const c=nvCfg();if(!ja)nvStatus('sync');
  try{const{data,error}=await NV.cli.from('casas').update({dados:db,rev:c.rev+1,atualizado_por:NV.user.email,atualizado_em:new Date().toISOString()}).eq('id',c.casa).eq('rev',c.rev).select();if(error)throw error;
    if(!data||!data.length){NV.pulling=false;return nvPuxar()} // alguém salvou antes: confere conflito
    nvSet({rev:data[0].rev,sujo:false,ultimo:data[0].atualizado_em});nvStatus('ok')}
  catch(e){nvStatus(navigator.onLine?'erro':'offline',e.message||String(e))}}
function nvOuvir(){if(!NV.cli||NV.canal)return;const c=nvCfg();
  NV.canal=NV.cli.channel('casa-'+c.casa).on('postgres_changes',{event:'UPDATE',schema:'public',table:'casas',filter:'id=eq.'+c.casa},p=>{const r=p.new;if(!r||r.rev<=nvCfg().rev)return;
    if(nvCfg().sujo){NV.conflito=r;nvStatus('conflito');render()}else{nvAplicar(r);nvStatus('ok');toast(`${r.atualizado_por===NV.user.email?'Outro aparelho':(r.atualizado_por||'Alguém')} atualizou os dados`)}}).subscribe()}
// toda gravação local marca "sujo" e envia em 2 s
{const _s=save;save=function(){_s();if(!NV.cli||!NV.user)return;nvSet({sujo:true});clearTimeout(NV.timer);NV.timer=setTimeout(()=>nvEnviar(),2000)}}
window.addEventListener('online',()=>{if(NV.user)nvPuxar()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&NV.user)nvPuxar()});

async function nvEntrar(cadastro){const em=document.getElementById('nv-em').value.trim(),pw=document.getElementById('nv-pw').value;if(!em||pw.length<6)return toast('E-mail e senha (mínimo 6 caracteres)');
  try{if(!NV.cli)await nvIniciar();const f=cadastro?NV.cli.auth.signUp({email:em,password:pw}):NV.cli.auth.signInWithPassword({email:em,password:pw});const{data,error}=await f;if(error)throw error;
    if(cadastro&&!data.session){toast('Conta criada. Confirme pelo link que chegou no e-mail e depois entre.');return}
    NV.user=data.user||data.session.user;toast('Conectado');await nvPuxar();nvOuvir();render()}catch(e){toast('Não deu certo: '+(e.message||e))}}

  try{localStorage.setItem(KEY,JSON.stringify(data.dados))}catch(e){}db=load();save();toast('Versão restaurada');render()}

function nvSQL(){const c=nvCfg(),g=(c.emailG||'email-do-gustavo@gmail.com').replace(/'/g,''),l=(c.emailL||'email-da-lorena@gmail.com').replace(/'/g,''),casa=c.casa;
return `-- CasaFinance: banco de dados (cole no Supabase > SQL Editor > Run)
create table if not exists public.casas (
  id text primary key,
  dados jsonb not null,
  rev bigint not null default 1,
  atualizado_em timestamptz not null default now(),
  atualizado_por text
);
create table if not exists public.casa_membros (
  casa_id text not null,
  email text not null,
  primary key (casa_id, email)
);
create table if not exists public.casa_versoes (
  id bigserial primary key,
  casa_id text not null,
  dados jsonb not null,
  rev bigint,
  salvo_em timestamptz not null default now(),
  salvo_por text
);

-- guarda uma cópia antes de cada alteração (no máximo 1 a cada 15 min, últimas 100)
create or replace function public.guardar_versao() returns trigger
language plpgsql security definer set search_path = public as $$
begin
  if not exists (select 1 from casa_versoes where casa_id = old.id and salvo_em > now() - interval '15 minutes') then
    insert into casa_versoes (casa_id, dados, rev, salvo_por) values (old.id, old.dados, old.rev, old.atualizado_por);
    delete from casa_versoes where casa_id = old.id and id not in
      (select id from casa_versoes where casa_id = old.id order by id desc limit 100);
  end if;
  return new;
end $$;
drop trigger if exists trg_versao on public.casas;
create trigger trg_versao before update on public.casas for each row execute function public.guardar_versao();

-- só quem está na lista de membros lê e grava
alter table public.casas enable row level security;
alter table public.casa_membros enable row level security;
alter table public.casa_versoes enable row level security;
create or replace function public.e_membro(c text) returns boolean
language sql stable security definer set search_path = public as $$
  select exists (select 1 from casa_membros where casa_id = c and lower(email) = lower(auth.jwt() ->> 'email'))
$$;
drop policy if exists le on public.casas;       create policy le on public.casas for select using (public.e_membro(id));
drop policy if exists cria on public.casas;     create policy cria on public.casas for insert with check (public.e_membro(id));
drop policy if exists altera on public.casas;   create policy altera on public.casas for update using (public.e_membro(id)) with check (public.e_membro(id));
drop policy if exists ve_membros on public.casa_membros; create policy ve_membros on public.casa_membros for select using (lower(email) = lower(auth.jwt() ->> 'email'));
drop policy if exists le_versoes on public.casa_versoes; create policy le_versoes on public.casa_versoes for select using (public.e_membro(casa_id));

-- permissões para o app (funciona mesmo com "expor novas tabelas" desligado)
grant usage on schema public to authenticated;
grant select, insert, update on public.casas to authenticated;
grant select on public.casa_membros, public.casa_versoes to authenticated;
revoke all on public.casas, public.casa_membros, public.casa_versoes from anon;

-- quem pode acessar esta casa
insert into public.casa_membros (casa_id, email) values
  ('${casa}', '${g}'),
  ('${casa}', '${l}')
on conflict do nothing;

-- atualização ao vivo entre os celulares
do $$ begin
  alter publication supabase_realtime add table public.casas;
exception when others then null; end $$;`}

try{themeMode=localStorage.getItem('cfTheme')||'auto';page=localStorage.getItem('cfPage')||'painel'}catch(e){}
if(!PAGES[page])page='painel';
setTheme(themeMode);render();
if(C().pinHash&&!sessionStorage.getItem('cfOk')){document.getElementById('lock').classList.add('on');document.getElementById('lock-pin').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()})}
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
