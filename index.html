const NV_KEY='cfNuvem',NV_LIB='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js';
const NV={cli:null,user:null,status:'off',msg:'',conflito:null,timer:null,canal:null,versoes:null,pulling:false};
function nvCfg(){try{return Object.assign({url:'',chave:'',casa:'minha-casa',emailG:'',emailL:'',rev:0,sujo:false,ultimo:''},JSON.parse(localStorage.getItem(NV_KEY)||'{}'))}catch(e){return{url:'',chave:'',casa:'minha-casa',emailG:'',emailL:'',rev:0,sujo:false,ultimo:''}}}
function nvSet(p){const c=Object.assign(nvCfg(),p);try{localStorage.setItem(NV_KEY,JSON.stringify(c))}catch(e){}return c}
function nvStatus(s,msg){NV.status=s;NV.msg=msg||'';const el=document.getElementById('nv-chip');if(el){el.className='nv-chip '+s;el.innerHTML=nvChipTxt()}const p=document.getElementById('nv-st');if(p)p.innerHTML=nvChipTxt()}
function nvChipTxt(){const c=nvCfg();return{off:'Só neste aparelho',login:'Entrar na nuvem',sync:'Sincronizando…',ok:`Salvo na nuvem${c.ultimo?' · '+new Date(c.ultimo).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):''}`,offline:'Sem internet — salvo no aparelho',erro:'Erro na nuvem',conflito:'Conflito — escolha a versão'}[NV.status]+(NV.msg&&NV.status==='erro'?`: ${esc(NV.msg)}`:'')}
function nvLib(){return window.supabase?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement('script');s.src=NV_LIB;s.onload=ok;s.onerror=()=>no(new Error('não carregou a biblioteca do Supabase'));document.head.appendChild(s)})}
async function nvIniciar(){const c=nvCfg();if(!c.url||!c.chave){nvStatus('off');return}
  try{await nvLib();NV.cli=window.supabase.createClient(c.url,c.chave,{auth:{persistSession:true,storageKey:'cfNuvemAuth'}});
    const{data}=await NV.cli.auth.getSession();NV.user=data&&data.session?data.session.user:null;
    NV.cli.auth.onAuthStateChange((_e,s)=>{const u=s?s.user:null;if((u&&u.id)!==(NV.user&&NV.user.id)){NV.user=u;if(u)nvPuxar();else nvStatus('login');if(page==='ajustes')render()}});
    if(!NV.user){nvStatus('login');return}
    await nvPuxar();nvOuvir()}catch(e){nvStatus(navigator.onLine?'erro':'offline',e.message)}}
function nvAplicar(remoto){try{localStorage.setItem(KEY,JSON.stringify(remoto.dados))}catch(e){}db=load();save0();nvSet({rev:remoto.rev,sujo:false,ultimo:remoto.atualizado_em});render()}
async function nvPuxar(){if(!NV.cli||!NV.user||NV.pulling)return;NV.pulling=true;nvStatus('sync');const c=nvCfg();
  try{const{data:r,error}=await NV.cli.from('casas').select('*').eq('id',c.casa).maybeSingle();if(error)throw error;
    if(!r){const{data:n,error:e2}=await NV.cli.from('casas').insert({id:c.casa,dados:db,rev:1,atualizado_por:NV.user.email}).select().single();if(e2)throw e2;nvSet({rev:1,sujo:false,ultimo:n.atualizado_em});nvStatus('ok');toast('Dados enviados para a nuvem');return}
    if(r.rev>c.rev){if(c.sujo){NV.conflito=r;nvStatus('conflito');render();return}nvAplicar(r);nvStatus('ok');toast(`Atualizado da nuvem (${r.atualizado_por||''})`);return}
    if(c.sujo)await nvEnviar(true);else nvStatus('ok')}
  catch(e){nvStatus(navigator.onLine?'erro':'offline',e.message||String(e))}finally{NV.pulling=false}}
async function nvEnviar(ja){if(!NV.cli||!NV.user)return;const c=nvCfg();if(!ja)nvStatus('sync');
  try{const{data,error}=await NV.cli.from('casas').update({dados:db,rev:c.rev+1,atualizado_por:NV.user.email,atualizado_em:new Date().toISOString()}).eq('id',c.casa).eq('rev',c.rev).select();if(error)throw error;
    if(!data||!data.length){NV.pulling=false;return nvPuxar()} // alguém salvou antes: confere conflito
    nvSet({rev:data[0].rev,sujo:false,ultimo:data[0].atualizado_em});nvStatus('ok')}
  catch(e){nvStatus(navigator.onLine?'erro':'offline',e.message||String(e))}}
function nvOuvir(){if(!NV.cli||NV.canal)return;const c=nvCfg();
  NV.canal=NV.cli.channel('casa-'+c.casa).on('postgres_changes',{event:'UPDATE',schema:'public',table:'casas',filter:'id=eq.'+c.casa},p=>{const r=p.new;if(!r||r.rev<=nvCfg().rev)return;
    if(nvCfg().sujo){NV.conflito=r;nvStatus('conflito');render()}else{nvAplicar(r);nvStatus('ok');toast(`${r.atualizado_por===NV.user.email?'Outro aparelho':(r.atualizado_por||'Alguém')} atualizou os dados`)}}).subscribe()}
// toda gravação local marca "sujo" e envia em 2 s

async function nvEntrar(cadastro){const em=document.getElementById('nv-em').value.trim(),pw=document.getElementById('nv-pw').value;if(!em||pw.length<6)return toast('E-mail e senha (mínimo 6 caracteres)');
  try{if(!NV.cli)await nvIniciar();const f=cadastro?NV.cli.auth.signUp({email:em,password:pw}):NV.cli.auth.signInWithPassword({email:em,password:pw});const{data,error}=await f;if(error)throw error;

function nvSQL(){const c=nvCfg(),g=(c.emailG||'email-do-p1@gmail.com').replace(/'/g,''),l=(c.emailL||'email-da-p2@gmail.com').replace(/'/g,''),casa=c.casa;
return `-- CasaFinance: banco de dados (cole no Supabase > SQL Editor > Run)
create table if not exists public.casas (
  id text primary key,
  dados jsonb not null,
  rev bigint not null default 1,
  atualizado_em timestamptz not null default now(),
  atualizado_por text
);
create table if not exists public.casa_membros (
  casa_id text not null,
  email text not null,
  primary key (casa_id, email)
);
create table if not exists public.casa_versoes (
  id bigserial primary key,
  casa_id text not null,
  dados jsonb not null,
  rev bigint,
  salvo_em timestamptz not null default now(),
  salvo_por text
);

-- guarda uma cópia antes de cada alteração (no máximo 1 a cada 15 min, últimas 100)
create or replace function public.guardar_versao() returns trigger
language plpgsql security definer set search_path = public as $$
begin
  if not exists (select 1 from casa_versoes where casa_id = old.id and salvo_em > now() - interval '15 minutes') then
    insert into casa_versoes (casa_id, dados, rev, salvo_por) values (old.id, old.dados, old.rev, old.atualizado_por);
    delete from casa_versoes where casa_id = old.id and id not in
      (select id from casa_versoes where casa_id = old.id order by id desc limit 100);
  end if;
  return new;
end $$;
drop trigger if exists trg_versao on public.casas;
create trigger trg_versao before update on public.casas for each row execute function public.guardar_versao();

-- só quem está na lista de membros lê e grava
alter table public.casas enable row level security;
alter table public.casa_membros enable row level security;
alter table public.casa_versoes enable row level security;
create or replace function public.e_membro(c text) returns boolean
language sql stable security definer set search_path = public as $$
  select exists (select 1 from casa_membros where casa_id = c and lower(email) = lower(auth.jwt() ->> 'email'))
$$;
drop policy if exists le on public.casas;       create policy le on public.casas for select using (public.e_membro(id));
drop policy if exists cria on public.casas;     create policy cria on public.casas for insert with check (public.e_membro(id));
drop policy if exists altera on public.casas;   create policy altera on public.casas for update using (public.e_membro(id)) with check (public.e_membro(id));
drop policy if exists ve_membros on public.casa_membros; create policy ve_membros on public.casa_membros for select using (lower(email) = lower(auth.jwt() ->> 'email'));
drop policy if exists le_versoes on public.casa_versoes; create policy le_versoes on public.casa_versoes for select using (public.e_membro(casa_id));

-- permissões para o app (funciona mesmo com "expor novas tabelas" desligado)
grant usage on schema public to authenticated;
grant select, insert, update on public.casas to authenticated;
grant select on public.casa_membros, public.casa_versoes to authenticated;
revoke all on public.casas, public.casa_membros, public.casa_versoes from anon;

-- quem pode acessar esta casa
insert into public.casa_membros (casa_id, email) values
  ('${casa}', '${g}'),
  ('${casa}', '${l}')
on conflict do nothing;

-- atualização ao vivo entre os celulares
do $$ begin
  alter publication supabase_realtime add table public.casas;
exception when others then null; end $$;`}

// SHA-256 em JS puro (funciona até quando o arquivo é aberto pelo WhatsApp, sem crypto.subtle)
function sha256js(ascii){function rr(v,a){return(v>>>a)|(v<<(32-a))}const mp=Math.pow,mw=mp(2,32);let r='',w=[],h=[],k=[],hl=ascii.length*8,i,j;let pc=0,ic={};
  for(let c=2;pc<64;c++){if(!ic[c]){for(i=0;i<313;i+=c)ic[i]=c;h[pc]=(mp(c,.5)*mw)|0;k[pc++]=(mp(c,1/3)*mw)|0}}h=h.slice(0,8);
  ascii+='\x80';while(ascii.length%64-56)ascii+='\x00';for(i=0;i<ascii.length;i++){j=ascii.charCodeAt(i);w[i>>2]|=j<<((3-i)%4)*8}w[w.length]=((hl/mw)|0);w[w.length]=hl;
  for(j=0;j<w.length;){const W=w.slice(j,j+=16),oh=h;h=h.slice(0,8);for(i=0;i<64;i++){const w15=W[i-15],w2=W[i-2],a=h[0],e=h[4];
    const t1=h[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&h[5])^((~e)&h[6]))+k[i]+(W[i]=(i<16)?W[i]:(W[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+W[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
    const t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&h[1])^(a&h[2])^(h[1]&h[2]));h=[(t1+t2)|0].concat(h);h[4]=(h[4]+t1)|0}for(i=0;i<8;i++)h[i]=(h[i]+oh[i])|0}
  for(i=0;i<8;i++)for(j=3;j+1;j--){const b=(h[i]>>(j*8))&255;r+=((b<16)?0:'')+b.toString(16)}return r}
const utf8=s=>unescape(encodeURIComponent(s));
function hashSenha(senha,salt){let x=utf8(salt+'|'+senha);for(let i=0;i<3000;i++)x=sha256js(x+salt);return x}
const novoSalt=()=>{const a=new Uint32Array(4);(window.crypto||{}).getRandomValues?crypto.getRandomValues(a):a.forEach((_,i)=>a[i]=Math.random()*4294967296);return[...a].map(v=>v.toString(36)).join('')};
function gerarSenha(){const cs='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';const a=new Uint32Array(10);try{crypto.getRandomValues(a)}catch(e){a.forEach((_,i)=>a[i]=Math.random()*1e9)}return[...a].map(v=>cs[v%cs.length]).join('')}

const PAPEIS={admin:{nome:'Administrador',desc:'Vê e altera tudo e gerencia os perfis'},extrato:{nome:'Consulta + envio de extrato',desc:'Vê tudo e pode enviar extratos'},consulta:{nome:'Só consulta',desc:'Vê tudo, não altera nada'},filho:{nome:'Filho(a)',desc:'Vê só as finanças dele(a)'}};
const SESS_KEY='cfSessao';let SESS=null;try{const s=JSON.parse(sessionStorage.getItem(SESS_KEY)||'null');if(s&&s.ate>Date.now())SESS=s.id}catch(e){}
const perfis=()=>db.perfis||(db.perfis=[]);
const perfilAtual=()=>SESS&&perfis().find(p=>p.id===SESS)||null;
const papel=()=>{const p=perfilAtual();return p?p.papel:'admin'};
const ehAdmin=()=>papel()==='admin';
const minhaPessoa=()=>{const p=perfilAtual();return(p&&p.pessoa)||'P1'};
function sessGravar(){try{sessionStorage.setItem(SESS_KEY,JSON.stringify({id:SESS,ate:Date.now()+30*60000}))}catch(e){}}
['click','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,()=>{if(SESS)sessGravar()},{passive:true}));
setInterval(()=>{if(!SESS)return;try{const s=JSON.parse(sessionStorage.getItem(SESS_KEY)||'null');if(!s||s.ate<Date.now()){SESS=null;mostrarGate('Sessão encerrada por inatividade.')}}catch(e){}},30000);

// páginas por papel
const PG_FILHO=['inicio','visao','filhos','perfil'];
function podeVer(p){const r=papel();if(r==='admin')return true;if(r==='filho')return PG_FILHO.includes(p);return!['ajustes','perfis'].includes(p)}
// gravação protegida
let PERM=0;
{const _s=save;save=function(){if(perfilAtual()&&!ehAdmin()&&!PERM){try{db=load()}catch(e){}toast('Seu perfil é só de consulta — nada foi alterado');setTimeout(render,50);return}_s()}}
const comPerm=f=>function(){PERM++;try{return f.apply(this,arguments)}finally{PERM--}};
importar=comPerm(importar);

/* ---- tela de entrada ---- */
let gateSel=null;
function mostrarGate(msg){document.body.classList.add('gated');let g=document.getElementById('gate');if(!g){g=document.createElement('div');g.id='gate';document.body.appendChild(g)}
  if(!perfis().length){g.innerHTML=gateSetup();return}
  const P=perfis();const sel=P.find(p=>p.id===gateSel);
  g.innerHTML=`<div class="gate-in">
   <div class="gate-logo"><span class="coin">R$</span> CasaFinance</div>
   ${sel?`<div class="gate-login">${avatarSVG(sel.avatar,'av-xl')}<h2>${esc(sel.nome)}</h2><p class="gate-papel">${PAPEIS[sel.papel].nome}</p>
     <form onsubmit="event.preventDefault();gateEntrar()"><input class="f" id="gate-pw" type="password" autocomplete="current-password" placeholder="Senha" autofocus>
     <button class="btn big">Entrar</button></form><p id="gate-msg" class="gate-msg">${msg?esc(msg):''}</p>
     <div class="gate-links"><button onclick="gateSel=null;mostrarGate()">‹ Trocar perfil</button><button onclick="gateEsqueci()">Esqueci a senha</button></div></div>`
   :`<h1>Quem está usando?</h1>${msg?`<p class="gate-msg">${esc(msg)}</p>`:''}<div class="gate-grid">${P.map(p=>`<button class="gate-p" onclick="gateSel='${p.id}';mostrarGate()">${avatarSVG(p.avatar,'av-lg')}<span>${esc(p.nome)}</span><small>${PAPEIS[p.papel].nome}</small></button>`).join('')}</div>`}
   </div>`;

function gateEntrar(){const p=perfis().find(x=>x.id===gateSel),pw=document.getElementById('gate-pw');if(!p||!pw)return;

function contar(root){(root||document).querySelectorAll('[data-count]').forEach(el=>{const alvo=+el.dataset.count,fmt=el.dataset.fmt||'brl',t0=performance.now(),dur=900;
  const f=v=>fmt==='pct'?pct(v):fmt==='int'?Math.round(v).toLocaleString('pt-BR'):fmt==='h'?min2hm(Math.round(v)):brl(v);
  const step=t=>{const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);el.textContent=f(alvo*e);if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)})}

function dashPessoa(p,k){const d=dadosPessoa(p,k),H=Object.entries(db.holerites||{}).filter(([x])=>x.startsWith(p+'|')).sort().pop();const h=H&&H[1];

     ${(db.ctps||[]).some(j=>(j.pessoa||'P1')===p)?`<button class="btn sm ghost" onclick="go('carteira');ctpsPessoa='${p}'">Ver carteira de trabalho</button>`:''}</section>

// nomes digitados viram p1/p2 para as regras
{const _n=MZ.norm;MZ.norm=s=>{let q=_n(s);const c=C();[[c.nome1,'p1'],[c.nome2,'p2']].forEach(([n,t])=>{const nn=normTxt(n||'');if(!nn||/^pessoa [12]$/.test(nn))return;q=q.replace(new RegExp(`\\b${nn.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}\\b`,'g'),t);const pr=nn.split(' ')[0];if(pr.length>2)q=q.replace(new RegExp(`\\b${pr}\\b`,'g'),t)});return q.replace(/\bpessoa (1|um)\b/g,'p1').replace(/\bpessoa (2|dois)\b/g,'p2')}}
// "eu" é a pessoa do perfil logado
MZ.pessoa=q=>{const me=minhaPessoa(),outro=me==='P1'?'P2':'P1';let x=q.replace(/minha (mulher|esposa|namorada)|meu (marido|esposo|namorado)/g,' parceiro ');
  const n1=/\bp1\b/.test(x),n2=/\bp2\b/.test(x),eu=/\beu\b|\bmeu\b|\bmeus\b|\bminhas?\b|\brecebo\b|\bgastei\b|\bfaltei\b|\btrabalhei\b|\bcheguei\b|\bfiz\b|\bganho\b|\bmim\b|\bganhava\b/.test(x),ele=/\bparceiro\b|\bela\b|\bele\b|\bdela\b|\bdele\b|esposa|marido/.test(x);
  if(n1&&!n2)return'P1';if(n2&&!n1)return'P2';if(eu&&!ele)return me;if(ele&&!eu)return outro;return null};

H.scr=(q)=>{const R=scrRows();if(!R.length)return A('Ainda não há histórico do Registrato. Lance os meses em <b>Crédito › Histórico (Registrato)</b> e eu acompanho dívidas e atrasos.',null,{mod:'credito'});const u=R[R.length-1];let txt;
  if(/em dia|nome limpo|sem atras|ultimo atraso|desde quando/.test(q)){const i=[...R].reverse().findIndex(r=>r.venc>0);const ult=[...R].reverse().find(r=>r.venc>0);txt=i<0?`Nenhum atraso em todo o histórico lançado (${R.length} meses).`:`Sem valor vencido há <b>${i}</b> mês(es). O último atraso foi em <b>${mesCurto(ult.mes)}</b> (${brl(ult.venc)}).`}
  else if(/pior|maior divida|mais devia|maior valor/.test(q)){const m=R.slice().sort((a,b)=>(b.emdia+b.venc)-(a.emdia+a.venc))[0],mv=R.slice().sort((a,b)=>b.venc-a.venc)[0];txt=`Maior dívida total: <b>${mesCurto(m.mes)}</b> (${brl(m.emdia+m.venc)}). Maior valor vencido: <b>${mesCurto(mv.mes)}</b> (${brl(mv.venc)}).`}
  else if(/quantas vezes|quantos meses/.test(q)&&/atras|venc/.test(q))txt=`Houve valor vencido em <b>${R.filter(r=>r.venc>0).length}</b> dos ${R.length} meses lançados.`;
  else txt=`No último Registrato (${mesCurto(u.mes)}): em dia <b>${brl(u.emdia)}</b> e ${u.venc?`<b class="neg">${brl(u.venc)} vencido</b>`:'<b>nada vencido</b>'}.${u.nota?` ${esc(u.nota)}`:''}`;
  return A(txt,{type:'line',labels:R.map(r=>mesCurto(r.mes)),datasets:[{label:'Em dia',data:R.map(r=>r.emdia),color:'--gus'},{label:'Vencido',data:R.map(r=>r.venc),color:'--stamp'}]},{mod:'credito'})};

     {p:'Qual o melhor uso do 13º se você tem dívida no rotativo do cartão?',o:['Viajar','Quitar a dívida do rotativo','Deixar parado na conta'],c:1,e:'O rotativo tem um dos juros mais altos do mercado.'},
     {p:'O 13º é…',o:['Um salário extra pago no fim do ano','Um empréstimo do patrão','Um imposto'],c:0,e:'Direito do trabalhador CLT, pago em até duas parcelas no fim do ano.'}]}]},
{id:'m3',t:'Crédito e dívidas',cor:'#ff4b4b',dica:{impulsivo:'Tire o cartão dos apps e sites. Ter que digitar o número de novo freia muitas compras.',poupador:'Usar o cartão com controle e pagar a fatura inteira ajuda a construir um bom histórico de crédito.',despreocupado:'Ative o débito automático da fatura no valor total e os alertas de compra no app do banco.',planejador:'Antes de qualquer crédito, compare o CET de pelo menos três ofertas.',generoso:'Nunca empreste seu nome ou cartão: a dívida fica no seu CPF.'},
 licoes:[
 {id:'m3l1',t:'Juros: a favor ou contra',cards:['Juros são o preço do dinheiro no tempo. Quem investe recebe juros; quem pega emprestado paga juros.','Nos juros compostos, os juros de um mês viram base para os juros do mês seguinte. É por isso que dívidas crescem tão rápido.','Rotativo do cartão e cheque especial estão entre os créditos mais caros. Desde 2024 os juros do rotativo têm teto (não passam do valor da dívida), mas continuam altíssimos.'],
  q:[{p:'Juros compostos significam…',o:['Juros sobre juros','Juros fixos para sempre','Ausência de juros'],c:0,e:'Os juros acumulados entram na base do mês seguinte.'},
     {p:'Qual destes costuma ter os juros mais altos?',o:['Financiamento imobiliário','Rotativo do cartão de crédito','Consignado'],c:1,e:'Rotativo e cheque especial estão entre os mais caros.'},
     {p:'Quem investe…',o:['Paga juros','Recebe juros','Não tem juros'],c:1,e:'Ao investir, você "empresta" seu dinheiro e recebe juros por isso.'}]},
 {id:'m3l2',t:'CET: o custo verdadeiro',cards:['A taxa de juros anunciada não é tudo. O CET (Custo Efetivo Total) soma juros, tarifas, impostos (IOF) e seguros embutidos.','A instituição é obrigada a informar o CET antes da contratação. Peça sempre e compare ofertas pelo CET, não pela parcela.','Uma parcela "que cabe no bolso" pode esconder um prazo longo e um custo total muito maior.'],
  q:[{p:'O que é o CET?',o:['Custo Efetivo Total do crédito','Cadastro de Empresas e Tributos','Conta Especial de Transferência'],c:0,e:'Inclui juros, tarifas, IOF e seguros.'},
     {p:'Para comparar dois empréstimos, o melhor é olhar…',o:['O valor da parcela','O CET','A cor do cartão'],c:1,e:'O CET mostra quanto o crédito realmente custa.'},
     {p:'Parcela baixa sempre significa crédito barato?',o:['Sim','Não, pode ser só um prazo maior','Só no cartão'],c:1,e:'Prazos longos reduzem a parcela, mas aumentam o total pago.'}]},
 {id:'m3l3',t:'Cartão de crédito sem sustos',cards:['O cartão é um meio de pagamento, não renda extra. O limite é do banco; o salário é que paga a fatura.','Pague sempre a fatura inteira. Pagar o mínimo leva ao rotativo e a dívida cresce rápido.','Uma prática recomendada é usar até cerca de 30% do limite. Parcelas "sem juros" também comprometem os próximos meses — conte com elas no orçamento.'],
  q:[{p:'O que acontece ao pagar só o mínimo da fatura?',o:['O resto entra no rotativo, com juros altos','Nada, é o normal','O banco perdoa o restante'],c:0,e:'O saldo não pago vira dívida no rotativo.'},
     {p:'Limite de R$ 1.000: usar até 30% é gastar até…',o:['R$ 100','R$ 300','R$ 1.000'],c:1,e:'30% de R$ 1.000 = R$ 300.'},
     {p:'Compras parceladas sem juros…',o:['Não afetam o orçamento','Comprometem a renda dos próximos meses','São sempre vantajosas'],c:1,e:'Cada parcela é uma conta fixa até acabar.'}]},
 {id:'m3l4',t:'Saindo das dívidas',cards:['Primeiro passo: listar todas as dívidas com valor, juros e parcela. O Registrato do Banco Central mostra empréstimos e financiamentos no seu CPF.','Priorize as de juros mais altos (cartão, cheque especial). Negocie: bancos e mutirões de renegociação costumam oferecer descontos.','Trocar dívida cara por barata (portabilidade, consignado) ajuda — desde que você não volte a usar o crédito caro.'],
  q:[{p:'Qual dívida pagar primeiro?',o:['A de menor juros','A de maior juros','A mais antiga'],c:1,e:'Atacar a mais cara reduz o total pago.'},
     {p:'Onde ver empréstimos registrados no seu CPF?',o:['No Registrato do Banco Central','Na Receita Federal','No INSS'],c:0,e:'O Registrato é gratuito e mostra dívidas, contas e chaves Pix.'},
     {p:'Antecipar o saque-aniversário do FGTS é…',o:['Um empréstimo, com juros','Um presente do governo','Gratuito'],c:0,e:'É crédito: o banco desconta do seu FGTS com juros.'}]}]},
{id:'m4',t:'Consumo planejado e consciente',cor:'#ff9600',dica:{impulsivo:'Faça lista antes de ir ao mercado ou abrir o app de delivery — e compre só o que está nela.',poupador:'Comprar barato demais pode sair caro: compare durabilidade, não só preço.',despreocupado:'Revise as assinaturas uma vez por mês; cancele o que não usou.',planejador:'Defina um preço-alvo para as compras grandes e acompanhe até ele aparecer.',generoso:'Presentes também cabem num orçamento anual: defina o valor no começo do ano.'},
 licoes:[

 {id:'m4l2',t:'Pesquisar e negociar',cards:['Pesquisar preço em pelo menos três lugares costuma render boa economia em compras grandes.','Peça desconto: pagamento à vista, Pix ou compra de vários itens são bons argumentos.','Comprou pela internet ou fora da loja? O Código de Defesa do Consumidor garante 7 dias para desistir (direito de arrependimento).'],

 {id:'m4l3',t:'Gastos invisíveis',cards:['Assinaturas, delivery, transporte por app e tarifas bancárias são gastos pequenos e frequentes que passam despercebidos.','Some tudo no mês: muitas famílias se assustam com o total de delivery e assinaturas.','Revise mensalmente. Pergunte: eu usei? Vale o preço? Existe opção mais barata ou gratuita?'],

{id:'m5',t:'Poupança e investimento',cor:'#ce82ff',dica:{impulsivo:'Programe a transferência para a reserva no dia do salário — o que não fica na conta não é gasto.',poupador:'Seu dinheiro parado na poupança pode render mais em opções igualmente seguras, como o Tesouro Selic.',despreocupado:'Comece com um valor automático e pequeno. O hábito importa mais que o valor.',planejador:'Separe objetivos por prazo: curto (reserva), médio (compras) e longo (aposentadoria).',generoso:'Cuide da sua reserva primeiro: só quem está seguro consegue ajudar os outros sem se afundar.'},

 {id:'m5l1',t:'Reserva de emergência',cards:['Reserva de emergência é o dinheiro para imprevistos: desemprego, saúde, conserto do carro. Ela evita recorrer a empréstimos caros.','Uma referência comum é ter de 3 a 6 meses das despesas essenciais. Quem tem renda instável deve buscar mais.','Ela precisa estar em aplicação segura e com resgate rápido (liquidez diária), como Tesouro Selic ou CDB de liquidez diária de instituição sólida.'],

 {id:'m5l2',t:'Inflação e rendimento',cards:['Inflação é o aumento geral dos preços. No Brasil, o índice oficial é o IPCA. Dinheiro parado perde poder de compra.','Um investimento só faz o dinheiro crescer de verdade se render acima da inflação (o chamado ganho real).','A poupança rende 0,5% ao mês mais TR quando a Selic está acima de 8,5% ao ano — normalmente menos que outras aplicações seguras.'],

 {id:'m5l3',t:'Renda fixa para começar',cards:['Tesouro Direto: títulos públicos federais, comprados pela internet a partir de valores baixos. O Tesouro Selic é indicado para reserva.','CDB, LCI e LCA são emitidos por bancos e contam com o FGC, que garante até R$ 250 mil por CPF por instituição (com limite global).','LCI e LCA são isentas de IR para pessoa física. Nos demais, o IR segue tabela regressiva: de 22,5% (até 6 meses) a 15% (acima de 2 anos).'],

 {id:'m5l4',t:'Longo prazo e aposentadoria',cards:['Nos investimentos, os juros compostos jogam a seu favor: quanto antes começar, mais o tempo trabalha por você.','A aposentadoria do INSS costuma ser menor que o salário da ativa. Complementar é importante.','Previdência privada: o PGBL permite deduzir até 12% da renda tributável na declaração completa do IR; o VGBL é indicado para quem faz a simplificada.'],

{id:'m6',t:'Prevenção e proteção',cor:'#00cd9c',dica:{impulsivo:'Desconfie de ofertas boas demais e de pressa: golpistas usam a urgência a seu favor.',poupador:'Proteja o que você construiu: seguro residencial costuma ser barato perto do que cobre.',despreocupado:'Ative a autenticação em duas etapas no banco e no e-mail hoje mesmo.',planejador:'Deixe organizado um documento com contas, seguros e contatos para a família em caso de imprevisto.',generoso:'Antes de fazer Pix para "um parente com número novo", ligue para o número antigo e confirme.'},

 {id:'m6l2',t:'Seguros',cards:['Seguro serve para riscos que você não conseguiria pagar sozinho: incêndio da casa, morte de quem sustenta a família, acidente grave.','Leia o que está coberto e o que está excluído. A franquia é o valor que você paga antes de o seguro cobrir.','Seguros "de brinde" embutidos em empréstimos e cartões encarecem o crédito (entram no CET). Você pode recusar a venda casada.'],

@m7|A psicologia do dinheiro|#8b5cf6|S2|m1|Inspirado em: A Psicologia Financeira (Morgan Housel)
!Repare que a vontade de gastar costuma vir junto com uma emoção. Dê nome a ela antes de pagar.
!Lembre que dinheiro guardado também serve para viver bem: definir o que é "suficiente" tira a culpa de gastar.
!Escreva em uma frase o que o dinheiro significa para você — clareza ajuda a prestar atenção nele.
!Inclua uma margem de erro nos seus planos: a vida raramente segue a planilha.
!Ajudar é bonito, mas defina o seu "suficiente" antes, para não se apertar sem perceber.
# Cada um tem sua história com o dinheiro
- A forma como você lida com dinheiro foi moldada pelo que viveu: a casa onde cresceu, crises que enfrentou, o que ouviu sobre ricos e pobres.
- Por isso duas pessoas inteligentes podem tomar decisões opostas e ambas acharem que estão certas. Ninguém é "louco" com dinheiro: cada um reage à própria experiência.
- Conhecer a sua história ajuda a perceber padrões: medo de faltar, vontade de compensar, aversão a falar de contas.
? Por que pessoas diferentes tomam decisões financeiras opostas?|*Porque suas experiências de vida moldam a visão sobre dinheiro|Porque uma delas sempre é burra|Porque só existe uma decisão certa|A experiência pessoal pesa tanto quanto a matemática nas decisões.
? O que ajuda a mudar um padrão financeiro?|*Perceber de onde ele vem e o que o dispara|Ignorar a própria história|Gastar mais para esquecer|Reconhecer o padrão é o primeiro passo para mudá-lo.
? Comportamento financeiro é…|*Tão importante quanto conhecimento técnico|Irrelevante se você sabe matemática|Só coisa de rico|Saber a conta não basta: é o comportamento que decide o resultado.
# Quanto é suficiente?
- Sem uma ideia de "suficiente", a meta anda sempre um passo à frente: ganha-se mais, gasta-se mais e a sensação de aperto continua.
- Comparar-se com os outros piora o problema. Sempre haverá alguém com mais — e muitas vezes o que você vê é só a parte bonita.
- Definir o suficiente não é deixar de crescer. É saber quais metas importam para você e parar de correr atrás das metas dos outros.
? O que acontece quando não existe um "suficiente"?|*A meta sobe junto com a renda e o aperto não acaba|O dinheiro passa a sobrar sozinho|A pessoa fica rica mais rápido|Sem limite, o padrão de vida cresce no mesmo ritmo da renda.
? Comparar seu padrão de vida com o de outras pessoas…|*Costuma levar a gastos para acompanhar quem tem mais|É a melhor forma de planejar|Ajuda a poupar|A comparação gera uma corrida que não tem fim.
? Definir o que é suficiente significa…|*Escolher as metas que importam para você|Nunca mais querer nada|Parar de trabalhar|É sobre prioridades próprias, não sobre desistir de crescer.
# Sorte, risco e humildade
- Resultados financeiros misturam decisões e acaso. Nem todo sucesso é mérito e nem todo fracasso é culpa.
- Por isso vale copiar hábitos amplos (gastar menos do que ganha, poupar com constância) e desconfiar de histórias de enriquecimento rápido.
- Ter humildade com o que pode dar errado leva a decisões mais seguras: reserva, diversificação e dívidas pequenas.
? Ao ver alguém que ficou rico rápido, o mais prudente é…|*Lembrar que sorte e risco também contam|Copiar exatamente o que ele fez|Apostar tudo na mesma ideia|Histórias de sucesso escondem os muitos que tentaram e perderam.
? Qual hábito vale para quase todo mundo?|*Gastar menos do que ganha, com constância|Investir tudo em uma só ação|Pegar empréstimo para investir|Hábitos simples e constantes funcionam em vários cenários.
? Reserva e diversificação são formas de…|*Se proteger do que pode dar errado|Ganhar dinheiro rápido|Evitar pagar impostos|Elas dão margem para o imprevisto.

- Ancoragem é quando o primeiro número que vemos influencia a decisão. Um "de R$ 999 por R$ 599" faz R$ 599 parecer barato, mesmo que o produto valha menos.
- Enquadramento é como a informação é apresentada. "Só R$ 3,99 por dia" soa pequeno, mas são quase R$ 1.500 por ano.
- Defesa: compare com o preço de outras lojas e transforme valores diários ou parcelas em totais por ano.

- A dor de perder R$ 100 costuma ser maior que a alegria de ganhar R$ 100. Por isso seguramos investimentos ruins esperando "voltar ao preço" e fugimos de boas decisões com algum risco.

- Efeito manada: comprar algo porque todos estão comprando. Foi assim em várias bolhas — e quem entra no fim costuma pagar caro.

# Planejar e registrar
- O Banco Central divide o orçamento em quatro etapas: planejamento, registro, agrupamento e avaliação.
- Planejamento: estime receitas e despesas do mês, separando fixas, variáveis e sazonais (IPTU, IPVA, matrícula) e as parcelas já assumidas.
- Registro: anote os gastos, de preferência diariamente, e guarde comprovantes. Extratos e faturas facilitam o trabalho.

# Agrupar e avaliar
- Agrupamento: organize os gastos por categorias (moradia, alimentação, transporte, lazer). Assim você vê onde o dinheiro realmente vai.
- Avaliação: confira se o mês foi superavitário (sobrou), neutro (zerou) ou deficitário (faltou) e se os gastos refletem suas prioridades.

- Use a ferramenta com a qual se sente mais confortável: caderno, planilha ou aplicativo. O melhor método é o que você mantém.

# Ativos, passivos e patrimônio líquido
- O balanço patrimonial é a foto da sua vida financeira em um dia: o que você tem (ativos) e o que você deve (passivos).
- Patrimônio líquido = ativos − passivos. É o que sobraria se você vendesse tudo e pagasse todas as dívidas.

# Bens de uso × bens que geram renda
- Separe os ativos de uso pessoal (casa onde mora, carro, móveis), que geram despesas, dos que geram renda (aplicações, imóvel alugado).
- Só os ativos que geram renda ajudam a pagar o seu futuro. Os de uso são importantes, mas consomem dinheiro.
- Um patrimônio grande concentrado em bens de uso pode esconder pouca liquidez para emergências.

# Índice de cobertura
- O índice de cobertura mostra por quantos meses você se sustenta sem renda: ativos de curto prazo ÷ despesas mensais.
- Exemplo: R$ 22 mil em aplicações com resgate rápido e despesas de R$ 5.500 por mês = 4 meses de cobertura.
- A referência para a reserva de emergência é de 3 a 6 meses de despesas.

# Como um financiamento funciona
- No financiamento, o banco paga o bem e você devolve em parcelas com juros. Cada parcela tem uma parte de juros e uma de amortização (o que abate a dívida).

# Tabela Price × SAC
- Tabela Price: parcelas fixas do começo ao fim. É mais fácil de planejar, mas o total de juros costuma ser maior.
- SAC (Sistema de Amortização Constante): a amortização é igual todo mês, então as parcelas começam maiores e vão diminuindo. O total de juros costuma ser menor.

# Não ponha todos os ovos na mesma cesta
- Diversificar é combinar investimentos com características diferentes. Quando um vai mal, outro pode compensar.
- Diversifique em tipos (renda fixa e variável), emissores, prazos e, para quem tem mais patrimônio, até países.

# Pirâmides e golpes
- Pirâmide financeira paga os antigos com o dinheiro dos novos. Quando a entrada de gente diminui, ela desaba. É crime.
- Sinais de alerta: retorno alto e garantido, pressa, bônus por indicar pessoas, empresa não autorizada pela CVM ou pelo Banco Central.
- Consulte a lista de alertas da CVM e o cadastro de instituições autorizadas antes de investir.

# Conversar antes de brigar
- Dinheiro está entre os maiores motivos de conflito em casais. A maioria das brigas vem de expectativas não conversadas.
- Cada um traz uma história com o dinheiro. Entender o perfil do outro (mais poupador, mais gastador) ajuda a combinar regras.
- Um encontro mensal para olhar o orçamento, sem acusações, transforma o dinheiro em projeto comum.

# Como dividir as contas
- Há modelos diferentes: tudo junto, tudo separado ou um modelo misto (conta conjunta para a casa e contas individuais).
- Uma divisão muito usada é proporcional à renda: quem ganha mais contribui com uma fatia maior das despesas da casa.

- A expectativa de vida no Brasil passou de cerca de 62 anos em 1980 para mais de 76 anos (IBGE). O dinheiro precisa durar mais.

- Por causa dos juros compostos, quem começa cedo precisa guardar bem menos por mês.

- Previdência complementar pode ser fechada (fundos de pensão de empresas, às vezes com contribuição do empregador) ou aberta (PGBL e VGBL, vendidos por bancos e seguradoras).

  else{const l=eduLic(LR.lid),ant=e.lic[l.id],nq=LR.S.filter(s=>s.k==='q'&&!s.re).length,precisao=Math.round(nq/(nq+LR.erros)*100),stars=LR.erros===0?3:LR.erros===1?2:1;
    xp=ant?5:10+(LR.erros===0?5:0);eduGanhar(e,xp,true);e.lic[l.id]={st:Math.max(stars,ant?ant.st:0),n:(ant?ant.n:0)+1,d:h};e.ultSec=l.sec;
    const m=eduMod(l.mod),modOk=eduModFeito(e,m)&&!ant;if(modOk){eduGanhar(e,30,false);extra=`<div class="er-chest" style="--c:${m.cor}">${eIco('trofeu',30)}<div><b>Módulo concluído: ${esc(m.t)}</b><small>+30 XP de bônus</small></div></div>`}
    const nc=eduConq(e);eduSave();const s=eduStreak(e);
    html=`<div class="er-big ok">${[1,2,3].map(i=>`<span class="er-st ${i<=stars?'on':''}" style="animation-delay:${i*160}ms">${eIco('estrela',54)}</span>`).join('')}</div><h2>${LR.erros===0?'Lição perfeita!':'Lição concluída!'}</h2>
     <div class="er-stats"><div class="es xp"><small>XP</small><b>+${xp+(modOk?30:0)}</b></div><div class="es ok"><small>Precisão</small><b>${precisao}%</b></div><div class="es fogo"><small>Ofensiva</small><b>${s} ${s===1?'dia':'dias'}</b></div></div>

     ${nc.length?`<p class="er-k">Novas conquistas</p><div class="er-nc">${nc.map(c=>eduMedalha(c,1,48)).join('')}</div>`:''}

  const el=document.getElementById('edu-run');el.innerHTML=`<div class="er-in er-end">${html}</div><div class="er-foot"><span></span><button class="ebtn" onclick="eduFechar()">Continuar</button></div>`;el.querySelector('.ebtn').focus();LR=null}

  const liga=perfis().map(p=>{const pe=db.educa&&db.educa[p.id]?eduDe(p.id):null;return{p,s:pe?eduSemana(pe):0,xp:pe?pe.xp:0,of:pe?eduStreak(pe):0}}).sort((a,b)=>b.s-a.s||b.xp-a.xp);

  document.body.appendChild(el);requestAnimationFrame(()=>el.classList.add('on'));setTimeout(()=>{if(el.isConnected&&document.getElementById('edu-cob')===el)eduCobFechar()},tipo==='acerto'?6000:15000)}

function eduCobranca(){const p=perfilAtual();if(!p||document.body.classList.contains('gated')||document.getElementById('edu-run')||page==='aprender')return;const e=edu();if(e.lembrete==='off')return;
  const h=hojeISO(),chave='eduCob_'+p.id+'_'+h;let vezes=0;try{vezes=+(e.lembrete==='suave'?localStorage:sessionStorage).getItem(chave)||0}catch(x){}
  if(vezes>=(e.lembrete==='insistente'?3:1))return;
  const s=eduStreak(e),hj=eduHoje(e),px=eduProxima(e),ult=Object.keys(e.dias).sort().pop(),sem=ult?diasEntre(ult,h):null;

function chaveOk(k){if(!/^\d{44}$/.test(k))return false;let s=0,p=2;for(let i=42;i>=0;i--){s+=+k[i]*p;p=p===9?2:p+1}let d=11-s%11;if(d>=10)d=0;return d===+k[43]}
const cpFmtCnpj=c=>c.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/,'$1.$2.$3/$4-$5');
const MESES_TXT={jan:1,fev:2,mar:3,abr:4,mai:5,jun:6,jul:7,ago:8,set:9,out:10,nov:11,dez:12};
function cpData(t){let m=t.match(/(\d{2})\/(\d{2})\/(\d{4}|\d{2})(?:[^\d\n]{0,8}(\d{2}):(\d{2}))?/);
  if(m){let y=+m[3];if(y<100)y+=2000;if(+m[1]>=1&&+m[1]<=31&&+m[2]>=1&&+m[2]<=12&&y>=2015&&y<=2040)return{data:isoDate(+m[1],+m[2],y),hora:m[4]?m[4]+':'+m[5]:''}}
  m=t.match(/(\d{1,2})\s*(?:de\s+)?(jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez)[a-zç]*\.?\s*(?:de\s+)?(\d{4})(?:[^\d\n]{0,8}(\d{2}):(\d{2}))?/i);
  if(m)return{data:isoDate(+m[1],MESES_TXT[m[2].toLowerCase()],+m[3]),hora:m[4]?m[4]+':'+m[5]:''};return{data:'',hora:''}}
function cpPessoaDe(nome){const n=normTxt(nome).replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim();if(n.length<3)return null;const tk=new Set(n.split(' '));
  for(const k of ['P1','P2']){const nomes=[...((C().pessoas||{})[k]||[]),k==='P1'?C().nome1:C().nome2,...perfis().filter(p=>p.pessoa===k).map(p=>p.nome)].filter(Boolean).map(x=>normTxt(x).replace(/[^a-z ]/g,' ').trim()).filter(x=>x&&!/^pessoa \d$/.test(x));
    if(nomes.some(x=>{const xs=x.split(/\s+/).filter(w=>w.length>=3);return xs.length&&xs.every(w=>tk.has(w))}))return k}return null}

/* ---------- leitura da NOTA FISCAL (NFC-e / cupom) ---------- */
const CP_LOJA_RE=/(supermerc|mercad|atacad|hiper|drogar|farmac|padari|panific|restaur|lanchon|posto|comerci|magazin|ltda|s\/?a\b|s\.a|eireli|\bepp\b|\bme\b|varej|distrib|alimento|super\b|loja)/i;
function cpLoja(L,cnpj){if(cnpj&&db.lojas&&db.lojas[cnpj])return db.lojas[cnpj].nome;
  const ini=L.slice(0,8).filter(l=>CP_LOJA_RE.test(l)&&!/cnpj|cpf|\bie\b|inscri|rua\b|\bav\b|avenida|estrada|rodovia|fone|cep|documento|auxiliar|consumidor|eletr/i.test(l));
  let s=ini[0]||'';if(!s){const i=L.findIndex(l=>/cnpj/i.test(l));s=(L[i+1]||L[0]||'')}
  s=s.replace(/\s-\s*\d+.*$/,'').replace(/\b(s\/?a|s\.a\.?|ltda\.?|eireli|epp|me)\b.*$/i,'').replace(/[^A-Za-zÀ-ú&' ]/g,' ').split(/\s+/).filter(w=>w==='&'||w.length>2||/^(de|da|do|e)$/i.test(w)).join(' ').trim();
  return s?cpTitulo(s):'Compra'}
function cpCupom(t,L){const r={tipo:'cupom',avisos:[]};
  // chave de acesso (44 dígitos) e CNPJ
  r.chave='';(t.replace(/[^\d\n]/g,' ').match(/\d[\d ]{45,90}\d/g)||[]).map(x=>x.replace(/\D/g,'')).forEach(x=>{for(let i=0;i+44<=x.length&&!r.chave;i++){const k=x.slice(i,i+44);if(chaveOk(k)&&/^(1[1-7]|2[1-9]|3[1-5]|4[1-3]|5[0-3])/.test(k))r.chave=k}});
  const cn=(t.match(/\d{2}[.,]?\s?\d{3}[.,]?\s?\d{3}\s?\/?\s?\d{4}\s?-?\s?\d{2}/g)||[]).map(x=>x.replace(/\D/g,'')).filter(cnpjOk);
  r.cnpj=r.chave?r.chave.slice(6,20):(cn[0]||'');
  const d=cpData(t);r.data=d.data;r.hora=d.hora;
  if(r.chave&&!r.data){r.data=`20${r.chave.slice(2,4)}-${r.chave.slice(4,6)}-01`;r.avisos.push('Confira o dia da compra')}
  const pegar=re=>{const m=t.match(re);return m?cpNum(m[1]):null};
  r.valor=pegar(/valor\s*(?:a|à|á)?\s*pagar[^\d\n]{0,12}([\d.]+,\d{2})/i)??pegar(/valor\s*total[^\d\n]{0,12}([\d.]+,\d{2})/i)??pegar(/\btotal\s*(?:r\$|rs)[^\d\n]{0,6}([\d.]+,\d{2})/i)
    ??pegar(/^\s*(?:cart[aã]o|dinheiro|pix|cr[eé]dito|d[eé]bito|vale|voucher)[^\d\n]{0,25}([\d.]+,\d{2})\s*$/im)??pegar(/\bvalor\s*:[^\d\n]{0,8}([\d.]+,\d{2})/i);
  const tl=normTxt(t);
  r.forma=/voucher|ticket|alelo|sodexo|pluxee|vale.?(refei|alimen)|\bvr\b|\bva\b|flash|caju|ben ?visa|swile|vr benef|green ?card/.test(tl)?'VR/VA':/cr[eé]dito/.test(tl)?'Cartão de crédito':/dinheiro/.test(tl)&&!/d[eé]bito|cart[aã]o/.test(tl)?'Dinheiro':'Pix/Débito';
  const sv=t.match(/saldo\s*(?:disp\w*|dispon\w*|atual)?\s*:?[^\d\n]{0,8}([\d.]+,\d{2})/i);if(sv)r.saldoVale=cpNum(sv[1]);
  r.desc=cpLoja(L,r.cnpj);
  const lj=r.cnpj&&db.lojas&&db.lojas[r.cnpj];
  r.cat=lj&&lj.cat?lj.cat:(()=>{const g=guessCat(normTxt(r.desc+' '+L.slice(0,6).join(' ')));return g!=='Outros'?g:/supermerc|mercad|atacad|hortifr|acougue|sacola/.test(tl)?'Mercado':'Outros'})();
  // itens (melhor esforço)
  r.itens=[];L.forEach((l,i)=>{const m=l.match(/^[\dA-Z]{6,14}\s+(.{3,}?)\s+([\d.]+,\d{2})\s*$/);if(m&&/[a-z]{3}/i.test(m[1])&&!/total|pagar|pago|troco|desconto|tribut|saldo|valor/i.test(l)){const ds=m[1].replace(/\s+\d+[.,]?\d*\s*(un|kg|lt|l|pc|cx|und|g|ml)\b.*$/i,'').replace(/\s+[\d.,]+$/,'').trim();r.itens.push({d:ds.slice(0,60),v:cpNum(m[2])})}
    else{const m2=l.match(/^[\dA-Z]{6,14}\s+([A-Za-zÀ-ú].{3,})$/);const nx=L[i+1]||'';const m3=nx.match(/^\s*\d+[.,]?\d*\s*[A-Z]{1,3}\s+[\d.]+,\d{2}\s+([\d.]+,\d{2})\s*$/i);if(m2&&m3)r.itens.push({d:m2[1].trim().slice(0,60),v:cpNum(m3[1])})}});
  r.cls='gasto';r.pessoa=minhaPessoa();
  if(!r.valor)r.avisos.push('Não encontrei o valor total — digite abaixo');if(!r.data)r.avisos.push('Não encontrei a data — confira');
  return r}

/* ---------- leitura de COMPROVANTE (Pix, transferência, boleto) ---------- */
const CP_SEC_DE=/^(de|origem|pagador|dados do pagador|quem pagou|conta de origem|remetente|dados de quem pagou|dados da origem)\s*:?$/i;
const CP_SEC_PARA=/^(para|destino|recebedor|favorecido|benefici[aá]rio|destinat[aá]rio|dados do recebedor|quem recebeu|conta de destino|dados de quem recebeu|dados do favorecido|dados do destino)\s*:?$/i;
const CP_LABEL=/^(cpf|cnpj|institui|banco|ag[eê]ncia|conta|chave|tipo|ispb|n[uú]mero|id\b|autentica|data|valor|realizad)/i;
function cpSecao(L,re){const out={nome:'',inst:''};const i=L.findIndex(l=>re.test(l.trim()));
  if(i>=0){for(let j=i+1;j<Math.min(L.length,i+7);j++){const l=L[j].trim();if(CP_SEC_DE.test(l)||CP_SEC_PARA.test(l))break;if(/^(i?nstitui\w*|banco)\s*:?$/i.test(l)){if(!out.inst&&L[j+1])out.inst=L[j+1].trim();j++;continue}if(/^(nome|raz[aã]o social|cpf|cnpj|conta|ag[eê]ncia|chave( pix)?|tipo de conta)\s*:?$/i.test(l))continue;const nm=l.match(/^nome\s*:?\s*(.+)$/i);
      if(!out.nome&&(nm||(!CP_LABEL.test(l)&&/[a-zà-ú]{3}/i.test(l)&&!/\d{3}/.test(l))))out.nome=(nm?nm[1]:l).trim();const ins=l.match(/^(?:i?nstitui[cç][aã]o|banco)\s*:?\s*(.+)$/i);if(ins&&!out.inst)out.inst=ins[1].trim()}}
  else{const m=L.join('\n').match(new RegExp('^(?:'+re.source.slice(2,re.source.indexOf(')'))+')\\s*:\\s*(.+)$','im'));if(m)out.nome=m[m.length-1].trim()}
  out.nome=out.nome.replace(/\s+(cpf|cnpj).*$/i,'').slice(0,60);out.inst=out.inst.replace(/\s*-\s*institui.*$/i,'').replace(/\s+s[.,]?a\.?$/i,'').slice(0,40);return out}
const cpBancoCurto=s=>{const n=normTxt(s);return /nu pag|nubank/.test(n)?'Nubank':/itau/.test(n)?'Itaú':/bradesco/.test(n)?'Bradesco':/santander/.test(n)?'Santander':/caixa/.test(n)?'Caixa':/banco do brasil|\bbb\b/.test(n)?'Banco do Brasil':/inter\b/.test(n)?'Inter':/c6/.test(n)?'C6':/picpay/.test(n)?'PicPay':/mercado pago/.test(n)?'Mercado Pago':s?cpTitulo(s.split(/\s+/).slice(0,2).join(' ')):''};
function cpComprovante(t,L){const r={tipo:'pix',avisos:[]};const tl=normTxt(t);
  r.boleto=/boleto|codigo de barras|linha digitavel/.test(tl);r.tipoTxt=r.boleto?'Comprovante de boleto':/\bpix\b/.test(tl)?'Comprovante de Pix':/\bted\b|transfer/.test(tl)?'Comprovante de transferência':'Comprovante de pagamento';
  const mv=t.match(/R\s?\$\s*([\d.]+,\d{2})/)||t.match(/valor[^\d\n]{0,20}([\d.]+,\d{2})/i);r.valor=mv?cpNum(mv[1]):null;
  const d=cpData(t);r.data=d.data;r.hora=d.hora;
  const e2=t.replace(/[\s\]\[|()]/g,'').match(/E\d{20}[A-Za-z0-9]{11}/);r.e2e=e2?e2[0].toUpperCase():'';
  r.de=cpSecao(L,CP_SEC_DE);r.para=cpSecao(L,CP_SEC_PARA);
  const pd=cpPessoaDe(r.de.nome),pp=cpPessoaDe(r.para.nome),mesmo=r.de.nome&&normTxt(r.de.nome)===normTxt(r.para.nome);
  const bd=cpBancoCurto(r.de.inst),bp=cpBancoCurto(r.para.inst);
  if(mesmo||(pd&&pd===pp)){r.cls='interno';r.pessoa=pd||pp||minhaPessoa();r.desc=`Pix entre suas contas${bd||bp?` (${bd||'?'} → ${bp||'?'})`:''}`;r.cat='Outros'}
  else if(pd&&pp){r.cls='casal';r.pessoa=pd;r.desc=`Pix para ${cpTitulo(r.para.nome.split(' ')[0])}`;r.cat='Outros'}
  else if(!pd&&pp){r.cls='entrada';r.pessoa=pp;r.desc=`Pix recebido de ${cpTitulo(r.de.nome||'?')}`;r.cat='Outros'}
  else{r.cls='gasto';r.pessoa=pd||minhaPessoa();const nm=r.para.nome?cpTitulo(r.para.nome):'';r.desc=(r.boleto?'Boleto':'Pix')+(nm?' · '+nm:'');const g=guessCat(normTxt(r.para.nome));r.cat=g}
  r.forma=r.boleto?'Boleto':'Pix/Débito';r.banco=bd||'Comprovante';
  if(!r.valor)r.avisos.push('Não encontrei o valor — digite abaixo');if(!r.data)r.avisos.push('Não encontrei a data — confira');
  return r}
function cpInterpretar(texto){const t=String(texto||'').replace(/\r/g,''),L=t.split('\n').map(l=>l.replace(/\s+/g,' ').trim()).filter(Boolean),tl=normTxt(t);
  if(/documento auxiliar|nfc-?e|nota fiscal|cupom fiscal|cnpj do emitente|valor a pagar|qtde\.? total|codigo descricao|sat n/.test(tl))return cpCupom(t,L);
  return cpComprovante(t,L)}

/* ---------- arquivos, câmera e OCR ---------- */
async function cpOCR(canvas,st){await carregarOCR(st);
  if(!CP_WORKER)CP_WORKER=await Tesseract.createWorker('por',1,{workerPath:'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js',corePath:'https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1',langPath:'https://cdn.jsdelivr.net/npm/@tesseract.js-data/por@1.0.0/4.0.0_best_int',logger:m=>{if(m.status==='recognizing text')st(`Lendo o texto… ${Math.round(m.progress*100)}%`)}});
  await CP_WORKER.setParameters({tessedit_pageseg_mode:'6',preserve_interword_spaces:'0'});const{data}=await CP_WORKER.recognize(canvas);return data.text}
function cpPreparar(img,suave){const w0=img.naturalWidth||img.videoWidth||img.width,h0=img.naturalHeight||img.videoHeight||img.height;const W=suave?Math.min(2200,Math.max(1400,w0*1.6)):Math.max(900,Math.min(1600,w0*1.4)),H=Math.round(h0*W/w0);
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);x.filter=suave?'grayscale(1) contrast(1.15)':'grayscale(1) contrast(1.6) brightness(1.08)';x.drawImage(img,0,0,W,H);return c}
function cpMiniatura(img){const w0=img.naturalWidth||img.videoWidth||img.width,h0=img.naturalHeight||img.videoHeight||img.height,W=240,H=Math.round(h0*W/w0);const c=document.createElement('canvas');c.width=W;c.height=Math.min(H,480);c.getContext('2d').drawImage(img,0,0,W,H);return c.toDataURL('image/jpeg',.7)}
async function cpQR(src){try{if(!('BarcodeDetector' in window))return'';const bd=new BarcodeDetector({formats:['qr_code']});const r=await bd.detect(src);return r[0]?r[0].rawValue:''}catch(e){return''}}
async function cpImagemDeArquivo(f){const url=URL.createObjectURL(f);const im=new Image();im.src=url;await im.decode();return im}
async function cpLerArquivo(f,st){let texto='',thumb='',qr='';
  if(/pdf/i.test(f.type)||/\.pdf$/i.test(f.name)){const buf=new Uint8Array(await f.arrayBuffer());const L=await pdfLines(buf.slice());texto=L.join('\n');
    if(texto.replace(/\s/g,'').length<40){st('PDF escaneado — lendo a imagem…');const cvs=await pdfCanvases(buf);for(const c of cvs){texto+='\n'+await cpOCR(cpPreparar(c),st)}if(cvs[0])thumb=cpMiniatura(cvs[0])}
    else{try{const cvs=await pdfCanvases(buf);if(cvs[0]){thumb=cpMiniatura(cvs[0]);qr=await cpQR(cvs[0])}}catch(e){}}}
  else if(/^image\//i.test(f.type)||/\.(jpe?g|png|webp|heic|bmp)$/i.test(f.name)){const im=await cpImagemDeArquivo(f);thumb=cpMiniatura(im);qr=await cpQR(im);texto=await cpOCR(cpPreparar(im),st);const r0=cpInterpretar(texto);if(!r0.valor||!cpData(texto).data||(r0.tipo==='pix'&&!r0.para.nome)){st('Lendo de novo com mais detalhe…');texto+='\n'+await cpOCR(cpPreparar(im,true),st)}}
  else texto=await f.text();
  return{texto,thumb,qr}}
function cpStatus(msg){let el=document.getElementById('cp-st');if(!msg){if(el)el.remove();return}if(!el){el=document.createElement('div');el.id='cp-st';el.className='cp-st';document.body.appendChild(el)}el.innerHTML=`${avatarSVG('merlin','cp-st-av')}<span>${esc(msg)}</span>`}
async function cpProcessar(itens){if(!podeLancar())return toast('Seu perfil não pode lançar compras');const novos=[];
  try{for(const it of itens){const st=m=>cpStatus((itens.length>1?`(${novos.length+1}/${itens.length}) `:'')+m);st('Lendo '+(it.nome||'a imagem')+'…');
      let lido;if(it.file)lido=await cpLerArquivo(it.file,st);else if(it.canvas){lido={thumb:cpMiniatura(it.canvas),qr:await cpQR(it.canvas),texto:await cpOCR(cpPreparar(it.canvas),st)}}else lido={texto:it.texto||'',thumb:'',qr:''};
      const r=cpInterpretar(lido.texto);r.thumb=lido.thumb;r.texto=lido.texto;r.arquivo=it.nome||'';
      if(lido.qr){const k=(lido.qr.match(/\d{44}/)||[''])[0];if(chaveOk(k)){r.chave=k;if(r.tipo==='cupom'&&!r.cnpj)r.cnpj=k.slice(6,20)}r.qr=/^https?:/.test(lido.qr)?lido.qr:''}
      if(r.tipo==='cupom'&&r.cnpj&&db.lojas&&db.lojas[r.cnpj]){r.desc=db.lojas[r.cnpj].nome;if(db.lojas[r.cnpj].cat)r.cat=db.lojas[r.cnpj].cat}
      if(!r.data)r.data=hojeISO();r.dup=cpDuplicado(r);novos.push(r)}}
  catch(e){toast('Não consegui ler: '+e.message)}finally{cpStatus('')}
  if(novos.length){CP_FILA=CP_FILA.concat(novos);cpModal()}}
function cpDuplicado(r){return db.tx.find(t=>(r.chave&&t.chave===r.chave)||(r.e2e&&t.e2e===r.e2e)||(r.valor&&Math.abs(Math.abs(t.valor)-r.valor)<.01&&t.data===r.data&&(t.origem==='cupom'||t.origem==='comprovante'||normTxt(t.desc).slice(0,10)===normTxt(r.desc).slice(0,10))))||null}

/* ---------- câmera ---------- */
const cpCelular=()=>matchMedia('(pointer:coarse)').matches;
function cpEscolher(camera){const i=document.createElement('input');i.type='file';i.accept='image/*,application/pdf,.pdf';i.multiple=!camera;if(camera)i.setAttribute('capture','environment');i.style.display='none';
  i.onchange=()=>{const fs=Array.from(i.files||[]);i.remove();if(fs.length)cpProcessar(fs.map(f=>({file:f,nome:f.name})))};document.body.appendChild(i);i.click()}
let CP_STREAM=null,CP_FACE='environment';
async function cpCamera(){if(!podeLancar())return toast('Seu perfil não pode lançar compras');if(cpCelular()||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return cpEscolher(true);
  let m=document.getElementById('cp-cam');if(!m){m=document.createElement('div');m.id='cp-cam';m.className='cp-ov';document.body.appendChild(m)}
  m.innerHTML=`<div class="cp-cam-in"><div class="cp-cam-top"><b>Fotografe a nota ou o comprovante</b><button class="cp-x" onclick="cpCameraFechar()" aria-label="Fechar">×</button></div><div class="cp-vid"><video id="cp-v" playsinline autoplay muted></video><div class="cp-guia"></div></div><p class="note">Deixe a nota inteira dentro da moldura, reta e bem iluminada.</p>
   <div class="cp-acts"><button class="btn ghost" onclick="cpCameraFechar();cpEscolher(false)">Escolher arquivo</button><button class="btn ghost" onclick="cpTrocarCam()">Trocar câmera</button><button class="cp-shot" onclick="cpCapturar()" aria-label="Tirar foto"></button></div></div>`;
  try{CP_STREAM=await navigator.mediaDevices.getUserMedia({video:{facingMode:CP_FACE,width:{ideal:1920},height:{ideal:1080}},audio:false});const v=document.getElementById('cp-v');v.srcObject=CP_STREAM;await v.play()}
  catch(e){cpCameraFechar();toast('Não consegui abrir a câmera — escolha uma foto ou PDF');cpEscolher(false)}}
function cpCameraFechar(){if(CP_STREAM){CP_STREAM.getTracks().forEach(t=>t.stop());CP_STREAM=null}const m=document.getElementById('cp-cam');if(m)m.remove()}
function cpTrocarCam(){CP_FACE=CP_FACE==='environment'?'user':'environment';if(CP_STREAM){CP_STREAM.getTracks().forEach(t=>t.stop());CP_STREAM=null}cpCamera()}
function cpCapturar(){const v=document.getElementById('cp-v');if(!v||!v.videoWidth)return;const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);cpCameraFechar();cpProcessar([{canvas:c,nome:'foto da câmera'}])}

/* ---------- conferência e lançamento ---------- */
const CP_TIPOS=[['gasto','Compra / gasto'],['interno','Entre suas contas'],['casal','Entre vocês'],['entrada','Recebido'],['guardado','Guardado']];
